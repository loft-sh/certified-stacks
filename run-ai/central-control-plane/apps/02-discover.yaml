# Waits for objects this Stack does not create, so a task can declare outputs over them.
#
# Two callers, both central control-plane tenancy:
#   - the tenant Stack, over Secrets the tenant cluster template syncs in from the Control Plane
#     Cluster.
#   - the registration Stack, over the endpoint ConfigMap the host Stack wrote.
#
# Platform allows task outputs only from namespaces that an App deploys into.
# For a templateRef task, Platform uses the referenced App's release namespace.
# This App must use `runai`. A parameter would move the manifests but not the output allow list.
#
# The wait fails this task when an object does not arrive.
# Without the wait, the tenant Stack can start before vCluster syncs `runai-ca-cert`.
# The NVIDIA Run:ai agent then reports a TLS error later.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: runai-step-02-discover
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[NVIDIA Run:ai Step - 2] Discover (await external objects)'
  description: >-
    Blocks until the named Secrets and ConfigMaps exist in namespace `runai`, so later tasks can read
    values out of objects written by another Stack or synced in from the Control Plane Cluster.
  defaultNamespace: runai
  config:
    manifests: |-
      {{- define "runai-discover.wait" -}}
      set -eu

      deadline=$(( $(date +%s) + AWAIT_TIMEOUT_SECONDS ))

      wait_for() {
        kind="$1"
        name="$2"
        while ! kubectl -n runai get "$kind" "$name" >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "timed out after ${AWAIT_TIMEOUT_SECONDS}s waiting for ${kind}/${name} in namespace runai" >&2
            echo "nothing in this Stack creates it. Inside a tenant cluster it arrives through" >&2
            echo "sync.fromHost.secrets.mappings on the tenant cluster template, and the facts" >&2
            echo "Secret is mapped from runai-backend/runai-tenant-facts-<registration slug> on the" >&2
            echo "Control Plane Cluster. Check that mapping, and that this tenant's registration" >&2
            echo "StackInstance exists and reached Healthy." >&2
            exit 1
          fi
          echo "waiting for ${kind}/${name} in namespace runai"
          sleep 5
        done
        echo "found ${kind}/${name}"
      }

      # Compare one key of a Secret against what the caller was configured with, before waiting on
      # anything that depends on the two agreeing. The tenant Stack uses this for the control-plane
      # CA: its `requireControlPlaneCA` must equal the host's `customCAEnabled`, which reaches the
      # tenant only inside the facts Secret. Disagreement either makes the wait below unsatisfiable
      # or, in the other direction, lets the NVIDIA Run:ai agent start with no CA to trust.
      if [ -n "${ASSERT_SECRET:-}" ]; then
        wait_for secret "$ASSERT_SECRET"
        actual="$(kubectl -n runai get secret "$ASSERT_SECRET" -o "jsonpath={.data.${ASSERT_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)"
        if [ "$actual" != "$ASSERT_VALUE" ]; then
          echo "${ASSERT_SECRET}.${ASSERT_KEY} is '${actual}' but this Stack was configured for '${ASSERT_VALUE}'" >&2
          echo "these must agree. '${ASSERT_KEY}' is written by the shared control plane, so change" >&2
          echo "this Stack to match it, not the other way round: set requireControlPlaneCA to" >&2
          echo "'${actual}' on this tenant Stack. Setting it true against a publicly trusted" >&2
          echo "control plane waits for a CA Secret that is never created; setting it false against" >&2
          echo "a custom CA starts the NVIDIA Run:ai agent with nothing to trust." >&2
          exit 1
        fi
        echo "${ASSERT_SECRET}.${ASSERT_KEY} agrees with this Stack ('${actual}')"
      fi

      # Unquoted on purpose: word splitting is how the comma-separated inputs become arguments.
      for name in $(echo "${AWAIT_SECRETS}" | tr ',' ' '); do
        wait_for secret "$name"
      done
      for name in $(echo "${AWAIT_CONFIGMAPS}" | tr ',' ' '); do
        wait_for configmap "$name"
      done
      {{- end -}}

      # This is not a hook. The release must own an object in `runai`.
      # This ConfigMap records awaited objects for `kubectl get cm` during a tenant failure.
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Release.Name }}-discover
        namespace: runai
      data:
        awaitSecrets: {{ .Values.awaitSecrets | default "" | quote }}
        awaitConfigMaps: {{ .Values.awaitConfigMaps | default "" | quote }}
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: runai-discover-{{ .Release.Name }}
        namespace: runai
        annotations:
          "helm.sh/hook": pre-install,pre-upgrade
          "helm.sh/hook-weight": "-5"
          "helm.sh/hook-delete-policy": before-hook-creation
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: runai-discover-{{ .Release.Name }}
        namespace: runai
        annotations:
          "helm.sh/hook": pre-install,pre-upgrade
          "helm.sh/hook-weight": "-5"
          "helm.sh/hook-delete-policy": before-hook-creation
      rules:
        - apiGroups: [""]
          resources: ["secrets", "configmaps"]
          verbs: ["get"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: runai-discover-{{ .Release.Name }}
        namespace: runai
        annotations:
          "helm.sh/hook": pre-install,pre-upgrade
          "helm.sh/hook-weight": "-5"
          "helm.sh/hook-delete-policy": before-hook-creation
      subjects:
        - kind: ServiceAccount
          name: runai-discover-{{ .Release.Name }}
          namespace: runai
      roleRef:
        kind: Role
        name: runai-discover-{{ .Release.Name }}
        apiGroup: rbac.authorization.k8s.io
      ---
      # A pre-install/pre-upgrade hook, so the release's own resources and every later task wait for
      # it. Helm blocks on hook Jobs, which is the whole mechanism here.
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: runai-discover-{{ .Release.Name }}
        namespace: runai
        annotations:
          "helm.sh/hook": pre-install,pre-upgrade
          "helm.sh/hook-weight": "0"
          "helm.sh/hook-delete-policy": before-hook-creation
      spec:
        backoffLimit: 0
        ttlSecondsAfterFinished: 600
        template:
          spec:
            serviceAccountName: runai-discover-{{ .Release.Name }}
      {{- if .Values.hookImagePullSecret }}
            imagePullSecrets:
              - name: {{ .Values.hookImagePullSecret | quote }}
      {{- end }}
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: discover
                image: {{ .Values.__image__ | quote }}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                env:
                  # kubectl writes a discovery cache under $HOME. The root filesystem is read-only.
                  - name: HOME
                    value: /tmp
                  - name: KUBECACHEDIR
                    value: /tmp/.kube-cache
                  - name: AWAIT_SECRETS
                    value: {{ .Values.awaitSecrets | default "" | quote }}
                  - name: AWAIT_CONFIGMAPS
                    value: {{ .Values.awaitConfigMaps | default "" | quote }}
                  - name: AWAIT_TIMEOUT_SECONDS
                    value: {{ .Values.awaitTimeoutSeconds | default "300" | quote }}
                  - name: ASSERT_SECRET
                    value: {{ .Values.assertSecret | default "" | quote }}
                  - name: ASSERT_KEY
                    value: {{ .Values.assertSecretKey | default "" | quote }}
                  - name: ASSERT_VALUE
                    value: {{ .Values.assertSecretValue | default "" | quote }}
                command: ["sh", "-c"]
                args:
                  - |
      {{ include "runai-discover.wait" . | indent 14 }}
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
  parameters:
    - variable: awaitSecrets
      label: Secrets to await
      description: Comma separated Secret names that must exist in namespace `runai` before this task completes.
      type: string
    - variable: awaitConfigMaps
      label: ConfigMaps to await
      description: Comma separated ConfigMap names that must exist in namespace `runai` before this task completes.
      type: string
    - variable: awaitTimeoutSeconds
      label: Await timeout (seconds)
      # Keep below timeout so failure identifies missing object instead of timing out.
      description: Task wait limit in seconds.
      type: string
      defaultValue: "300"
    - variable: assertSecret
      label: Secret to check a key in
      # Empty disables the check, which is how the registration Stack uses this App.
      description: Secret in `runai` whose key must match `assertSecretValue` before the wait begins.
      type: string
      validation: '^$|^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
    - variable: assertSecretKey
      label: Key to check
      description: Key within `assertSecret`.
      type: string
    - variable: assertSecretValue
      label: Expected value
      description: Value the caller was configured with; the task fails when the Secret disagrees.
      type: string
    - variable: hookImagePullSecret
      label: Hook image pull secret
      # Secret must be in `runai` and pull vCluster Platform image. Needed only on Control Plane
      # Cluster. Tenant cluster Jobs sync to host and use vCluster workload ServiceAccount.
      description: If the vCluster Platform image requires a pull secret, specify the Secret name here; otherwise leave blank.
      type: string
      validation: '^$|^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'

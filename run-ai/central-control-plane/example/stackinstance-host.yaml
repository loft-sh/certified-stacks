# Apply this shared host foundation once per Control Plane Cluster, before you create tenants.
#
# Name this StackInstance `runai`. The control-plane chart requires release `runai-backend`.
# The release name is `<StackInstance name>-<task name>`.
#
# Set `runaiRegistryCredentials`, `storageClass`, `hostIngressAddress`, and administrator credentials before you apply.
# Tenant Stacks and tenant clusters do not receive administrator credentials.
apiVersion: management.loft.sh/v1
kind: StackInstance
metadata:
  name: runai
spec:
  displayName: "NVIDIA Run:ai shared host foundation"
  owner:
    user: admin
  destination:
    cluster:
      name: loft-cluster
  templateRef:
    name: run-ai-central-control-plane-host
  parameters:
    controlPlaneName: runai
    hostIngressAddress: "<HOST_NGINX_LOADBALANCER_IPV4>"
    storageClass: "<STORAGE_CLASS>"
    adminUsername: "<ADMIN_EMAIL>"
    adminPassword: "<ADMIN_PASSWORD>"
    dockerServer: https://runai.jfrog.io
    dockerUsername: self-hosted-image-puller-prod
    dockerEmail: support@run.ai
    runaiRegistryCredentials: "<JFROG_TOKEN>"
    # Optional. Name of a dockerconfigjson Secret you create in namespace `runai` on this cluster
    # BEFORE applying, able to pull the vCluster Platform image. The bootstrap Jobs run as that
    # image and run directly here, so nothing supplies them a credential automatically. Needed only
    # when your Platform image is from a private registry or an air-gapped mirror. Check with:
    #   kubectl -n vcluster-platform get pod -l app=loft \
    #     -o jsonpath='{.items[0].spec.containers[?(@.name=="manager")].image}'
    # This is not the NVIDIA Run:ai registry credential above: pull secrets match by registry host.
    # hookImagePullSecret: platform-reg-creds
    # Optional. A real domain you control, instead of the derived nip.io name. Strongly recommended
    # in production: one nip.io name shared by every tenant can never carry a publicly trusted
    # certificate. DNS for it and `*.` under it must resolve to the host ingress LoadBalancer.
    # domain: runai.example.com
    # TLS defaults to a self-signed certificate. See README section "TLS".
    # Use a trusted certificate before production use:
    # tlsMode: user-provided
    # userTlsSecretName: my-runai-tls
    # Set this when that chain is publicly trusted:
    # customCAEnabled: "false"

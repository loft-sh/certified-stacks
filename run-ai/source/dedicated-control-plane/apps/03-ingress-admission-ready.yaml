# Wait for ingress-nginx admission webhook before installing control-plane Ingresses.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: runai-step-03-ingress-admission-ready
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[NVIDIA Run:ai Step - 3] Wait for Ingress admission webhook'
  description: Blocks dependent steps until ingress-nginx admission webhook accepts TLS connections.
  defaultNamespace: ingress-nginx
  wait: true
  timeout: 6m
  config:
    manifests: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: runai-ingress-admission-ready
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 300
        template:
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: wait
                # The running Platform's own image, as every other hook Job uses. A literal image
                # would pull from whatever registry this manifest was written against, which no
                # private-registry or air-gapped install can do, and it would have to pin a foreign
                # numeric UID to satisfy `runAsNonRoot` above.
                image: {{ .Values.__image__ | quote }}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                command: ["sh", "-ec"]
                args:
                  - |
                    # This container is non-root with a read-only root filesystem, so it cannot
                    # install anything. Require the tool in the image, as the other hook Jobs do.
                    # Failing here names the cause; a missing tool would otherwise surface as the
                    # App's opaque `wait` timeout.
                    command -v curl >/dev/null || { echo "missing curl; the Platform image must provide it" >&2; exit 1; }

                    url="https://{{ .Values.ingressAdmissionServiceName }}.ingress-nginx.svc:443/networking/v1/ingresses"
                    for i in $(seq 1 150); do
                      code="$(curl -sk --connect-timeout 2 -o /dev/null -w '%{http_code}' "$url" || true)"
                      case "$code" in
                        2*|3*|4*) exit 0 ;;
                      esac
                      sleep 2
                    done
                    exit 1
  parameters:
    - variable: ingressAdmissionServiceName
      label: Ingress admission Service name
      type: string
      required: true
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$

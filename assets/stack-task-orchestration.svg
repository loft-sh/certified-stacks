<svg viewBox="0 0 706 366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An example StackInstance containing four tasks. App 1 and App 2 start without dependencies. A third App task waits for App 1 to report Healthy. An Argo CD Application task waits for Apps 1 and 2 and reads an output shared by the third task.">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="stack-orchestration-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="706" height="366" fill="#FFFFFF"/>
  <rect x="28" y="28" width="650.0" height="310.0" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="52" y="54" font-size="16" font-weight="600" fill="#050B24">StackInstance</text>

  <rect x="52.0" y="82.0" width="146.0" height="88" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="125.0" y="114.0" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">App 1</text>
  <rect x="105.0" y="132.0" width="40.0" height="24" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1"/>
  <text x="125.0" y="149.0" font-family="'Roboto Mono', monospace" font-size="14" font-weight="500" fill="#828592" text-anchor="middle">App</text>

  <rect x="509.5" y="82.0" width="97.0" height="88" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="558.0" y="114.0" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">App 2</text>
  <rect x="538.0" y="132.0" width="40.0" height="24" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1"/>
  <text x="558.0" y="149.0" font-family="'Roboto Mono', monospace" font-size="14" font-weight="500" fill="#828592" text-anchor="middle">App</text>

  <rect x="52.0" y="226.0" width="220.0" height="88" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="162.0" y="258.0" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Depends on App 1</text>
  <rect x="142.0" y="276.0" width="40.0" height="24" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1"/>
  <text x="162.0" y="293.0" font-family="'Roboto Mono', monospace" font-size="14" font-weight="500" fill="#828592" text-anchor="middle">App</text>

  <rect x="400.0" y="226.0" width="254.0" height="88" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="527.0" y="258.0" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Depends on Apps 1 &amp; 2</text>
  <rect x="451.0" y="276.0" width="152.0" height="24" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1"/>
  <text x="527.0" y="293.0" font-family="'Roboto Mono', monospace" font-size="14" font-weight="500" fill="#828592" text-anchor="middle">ArgoCDApplication</text>

  <line x1="125.0" y1="174.0" x2="125.0" y2="222.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#stack-orchestration-arrow)"/>
  <line x1="558.0" y1="174.0" x2="558.0" y2="222.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#stack-orchestration-arrow)"/>
  <line x1="276.0" y1="270.0" x2="396.0" y2="270.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#stack-orchestration-arrow)"/>
  <text x="336.0" y="256.0" font-size="14" font-weight="400" fill="#696D7C" text-anchor="middle">shares output</text>

  <rect x="218.0" y="94.0" width="224.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="330.0" y="120.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Arrows wait until their</text>
  <text x="330.0" y="138.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">dependency reports Healthy.</text>
</svg>

# Keep StackInstance name `runai` and step name `cluster`.
# Chart requires release `runai-cluster`.
# Keep chart version here. Chart fields do not use Go templates.
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-10-cluster
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[Run:AI Step - 10] Cluster'
  description: run:ai cluster components, registered against the self-hosted control plane.
  defaultNamespace: runai
  wait: true
  timeout: 20m
  config:
    chart:
      name: runai-cluster
      version: "2.24.86"
      repoURL: https://runai.jfrog.io/artifactory/api/helm/run-ai-charts
    values: |-
      controlPlane:
        url: "{{ .Values.fqdn }}"
        clientSecret: "{{ .Values.clientSecret }}"
      cluster:
        uid: "{{ .Values.clusterUID }}"
        url: "{{ .Values.fqdn }}"
      global:
        customCA:
          enabled: true
      clusterConfig:
        global:
          ingress:
            ingressClass: "{{ .Values.ingressClass }}"
  parameters:
    - variable: fqdn
      label: Control-plane FQDN
      description: Domain the control plane is served on; also the cluster's own URL in this single-cluster layout.
      type: string
      required: true
    - variable: clusterUID
      label: Cluster UID
      description: uuid the control plane assigned when the cluster was registered.
      type: string
      required: true
    - variable: clientSecret
      label: Cluster client secret
      description: OIDC client secret from the cluster-install-info call; the cluster agent authenticates with it.
      type: password
      required: true
    - variable: ingressClass
      label: Ingress class
      type: string
      required: true
      defaultValue: nginx
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$

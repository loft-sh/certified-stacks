# Update `fromResource` Service name if you rename instance or ingress step.
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-02-ingress-nginx
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[Run:AI Step - 2] Ingress NGINX'
  description: Ingress controller exposed through a LoadBalancer service.
  defaultNamespace: ingress-nginx
  wait: true
  timeout: 5m
  config:
    chart:
      name: ingress-nginx
      repoURL: https://kubernetes.github.io/ingress-nginx
      version: 4.15.1
    values: |-
      controller:
        kind: DaemonSet
        hostPort:
          enabled: true
        service:
          type: LoadBalancer
        ingressClass: "{{ .Values.ingressClass }}"
        ingressClassResource:
          name: "{{ .Values.ingressClass }}"
  parameters:
    - variable: ingressClass
      label: Ingress class
      type: string
      required: true
      defaultValue: nginx
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$

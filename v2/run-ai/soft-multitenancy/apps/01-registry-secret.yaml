
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-01-registry-secret
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[Run:AI Step - 1] Registry Pull Secret'
  description: Creates Helm-managed image-pull Secret copies for control-plane and cluster releases.
  defaultNamespace: runai
  wait: true
  timeout: 5m
  config:
    manifests: |-
      {{- if not (lookup "v1" "Namespace" "" "runai-backend") }}
      apiVersion: v1
      kind: Namespace
      metadata:
        name: runai-backend
        annotations:
          helm.sh/resource-policy: keep
      {{- end }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .Values.registrySecretName | quote }}
        namespace: runai
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ dict "auths" (dict .Values.dockerServer (dict "username" .Values.dockerUsername "password" .Values.runaiRegistryCredentials "email" .Values.dockerEmail "auth" (printf "%s:%s" .Values.dockerUsername .Values.runaiRegistryCredentials | b64enc))) | toJson | b64enc | quote }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .Values.registrySecretName | quote }}
        namespace: runai-backend
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ dict "auths" (dict .Values.dockerServer (dict "username" .Values.dockerUsername "password" .Values.runaiRegistryCredentials "email" .Values.dockerEmail "auth" (printf "%s:%s" .Values.dockerUsername .Values.runaiRegistryCredentials | b64enc))) | toJson | b64enc | quote }}
  parameters:
    - variable: registrySecretName
      label: Registry secret name
      type: string
      required: true
      defaultValue: runai-reg-creds
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    - variable: dockerServer
      label: Docker registry server
      type: string
      required: true
      defaultValue: https://runai.jfrog.io
    - variable: dockerUsername
      label: Docker registry username
      type: string
      required: true
      defaultValue: self-hosted-image-puller-prod
    - variable: runaiRegistryCredentials
      label: Docker registry token
      type: password
      required: true
    - variable: dockerEmail
      label: Docker registry email
      type: string
      required: true
      defaultValue: support@run.ai

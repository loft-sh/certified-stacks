# Use StackInstance name `runai`.
# Charts require releases `runai-backend` and `runai-cluster`.
# Apply this file or `stackinstance.yaml`. Do not apply both files.
apiVersion: storage.loft.sh/v1
kind: StackInstance
metadata:
  name: runai
spec:
  displayName: "run:ai self-hosted (full infra, nip.io)"
  owner:
    user: admin
  destination:
    cluster:
      name: loft-cluster
  templateRef:
    name: runai-selfhosted-nipio-fake-gpu
  # Set `runaiRegistryCredentials` and `storageClass` before you apply this stack.
  inputs:
    tenant: runai
    # runaiRegistryCredentials: "<JFROG_TOKEN>"
    # storageClass: "<STORAGE_CLASS>"
    clusterName: runai
    # TLS defaults to a self-signed certificate. See README section "TLS".
    # Use a trusted certificate before production use. This Stack creates its own cluster, so
    # supply PEM inline rather than referencing a Secret that cannot exist yet:
    # tlsMode: user-provided
    # userTlsCert: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    # userTlsKey: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...
    # Set both of these only when that chain is publicly trusted:
    # customCAEnabled: "false"
    # skipTLSVerify: "false"

# Publishes everything ONE central-control-plane tenant needs, as a single Secret on the Control Plane Cluster.
#
# The tenant cluster template syncs this Secret into the tenant under a fixed name, and the tenant
# Stack reads its keys as task outputs. That replaces four values an operator used to copy out of the
# registration Stack's status and paste into the tenant cluster's parameters, and it means a rotated
# client secret reaches the tenant on the next reconcile instead of going stale in a parameter.
#
# Owned by the registration Stack, so it lives and dies with that tenant's registration. Deleting the
# registration therefore breaks later upgrades of that tenant's Stack, which is the documented
# teardown order anyway: tenant cluster first, registration second.
#
# The name is suffixed with the tenant slug because every registration instance shares namespace
# `runai-backend`. A fixed name would let one tenant read another's cluster UID and client secret.
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-03-tenant-facts
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[Run:AI Step - 3] Tenant facts'
  description: >-
    Writes one Secret per central-control-plane tenant holding the shared control plane's FQDN, that tenant's own
    cluster URL, its cluster UID, its client secret, and whether the control plane's CA must be
    trusted. The tenant cluster syncs it in and needs no other input.
  defaultNamespace: runai-backend
  config:
    manifests: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: "runai-tenant-facts-{{ .Values.tenantSlug }}"
        namespace: runai-backend
      type: Opaque
      stringData:
        fqdn: "{{ .Values.controlPlaneFqdn }}"
        clusterdomain: "{{ .Values.clusterDomain }}"
        uid: "{{ .Values.clusterUID }}"
        clientsecret: "{{ .Values.clientSecret }}"
        customcaenabled: "{{ .Values.customCAEnabled }}"
  parameters:
    - variable: tenantSlug
      label: Tenant slug
      description: Suffix of this Secret's name. Must be the slug the tenant was registered under.
      type: string
      required: true
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    - variable: controlPlaneFqdn
      label: Control-plane FQDN
      description: Domain the SHARED control plane is served on.
      type: string
      required: true
    - variable: clusterDomain
      label: Tenant cluster domain
      # Registration writes this with same expression, so control plane and tenant agent use same
      # domain.
      description: Domain for tenant cluster workloads.
      type: string
      required: true
    - variable: clusterUID
      label: Cluster UID
      description: uuid the control plane assigned when this tenant's cluster was registered.
      type: string
      required: true
    - variable: clientSecret
      label: Cluster client secret
      description: OIDC client secret from the cluster-install-info call.
      type: password
      required: true
    - variable: customCAEnabled
      label: Trust the control plane's CA
      description: Read from the control plane's endpoint ConfigMap, not restated per tenant.
      type: boolean
      defaultValue: "true"

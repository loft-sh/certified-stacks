# `fullnameOverride` below pins every object name, so the Service the ingress task reads its
# `address` output from does not move when the release name does.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: runai-step-02-ingress-nginx
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[NVIDIA Run:ai Step - 2] Ingress NGINX'
  description: Ingress controller exposed through a LoadBalancer service.
  defaultNamespace: ingress-nginx
  wait: true
  timeout: 10m
  config:
    chart:
      name: ingress-nginx
      repoURL: https://kubernetes.github.io/ingress-nginx
      version: 4.15.1
    values: |-
      fullnameOverride: runai-ingress
      controller:
        kind: DaemonSet
        # No hostPort. Host ports 80/443 are a per-node singleton, so binding them limits the
        # node pool to one tenant's controller. Traffic reaches pods through the LoadBalancer.
        service:
          type: LoadBalancer
          {{ if eq .Values.ingressProvider "aws" }}
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: external
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
            service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=false
          {{ end }}
        ingressClass: "{{ .Values.ingressClass }}"
        ingressClassResource:
          name: "{{ .Values.ingressClass }}"
  parameters:
    - variable: ingressClass
      label: Ingress class
      type: string
      required: true
      defaultValue: nginx
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    - variable: ingressProvider
      label: Ingress provider
      type: string
      required: true
      defaultValue: standard
      options:
        - standard
        - aws

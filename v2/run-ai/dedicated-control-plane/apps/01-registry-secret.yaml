
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-01-registry-secret
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[NVIDIA Run:ai Step - 1] Registry Pull Secret'
  description: Creates Helm-managed image-pull Secret copies for control-plane and cluster releases.
  defaultNamespace: runai
  wait: true
  timeout: 5m
  config:
    manifests: |-
      {{- if not (or .Values.dockerConfigJson (and .Values.dockerServer .Values.dockerUsername .Values.runaiRegistryCredentials .Values.dockerEmail)) }}
      {{- fail "runai-step-01-registry-secret: set dockerConfigJson, or all four of dockerServer, dockerUsername, runaiRegistryCredentials and dockerEmail" }}
      {{- end }}
      {{- $inline := dict "auths" (dict .Values.dockerServer (dict "username" .Values.dockerUsername "password" .Values.runaiRegistryCredentials "email" .Values.dockerEmail "auth" (printf "%s:%s" .Values.dockerUsername .Values.runaiRegistryCredentials | b64enc))) | toJson | b64enc }}
      {{- $dockerconfig := .Values.dockerConfigJson | default "" | b64enc | default $inline }}
      {{- if .Values.copyToControlPlaneNamespace }}
      {{- if not (lookup "v1" "Namespace" "" "runai-backend") }}
      apiVersion: v1
      kind: Namespace
      metadata:
        name: runai-backend
        annotations:
          helm.sh/resource-policy: keep
      {{- end }}
      ---
      {{- end }}
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .Values.registrySecretName | quote }}
        namespace: runai
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ $dockerconfig | quote }}
      {{- if .Values.copyToControlPlaneNamespace }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .Values.registrySecretName | quote }}
        namespace: runai-backend
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ $dockerconfig | quote }}
      {{- end }}
  parameters:
    - variable: registrySecretName
      label: Registry secret name
      type: string
      required: true
      defaultValue: runai-reg-creds
      validation: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    - variable: dockerServer
      label: Docker registry server
      type: string
    - variable: dockerUsername
      label: Docker registry username
      type: string
    - variable: runaiRegistryCredentials
      label: Docker registry token
      type: password
    - variable: dockerEmail
      label: Docker registry email
      type: string
    - variable: dockerConfigJson
      label: Docker config JSON
      # This replaces dockerServer, dockerUsername, runaiRegistryCredentials, and dockerEmail.
      # Tenant Stacks receive this value from a host-synced Secret task output, decoded by Platform.
      # Do not interpolate it into rendered YAML without encoding. It contains quoted JSON.
      description: Docker configuration JSON for registry access.
      type: password
    - variable: copyToControlPlaneNamespace
      label: Also create the Secret in runai-backend
      # Control-plane releases use this Secret in `runai-backend`.
      # Keep false in tenant clusters. They run no control plane.
      description: Create a registry Secret in `runai-backend`.
      type: boolean
      defaultValue: "true"

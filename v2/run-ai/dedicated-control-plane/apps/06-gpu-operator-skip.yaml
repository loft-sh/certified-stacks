# The `gpuProvider: gke` half of step 6. Selected by the gpu task's templated `templateRef.name`,
# not by a parameter read in here: a StackTemplate task cannot be skipped, but every string in a
# task is rendered, so pointing the task at this App is how the GPU Operator gets skipped.
#
# Installs no GPU Operator. On a GKE GPU node pool Google already owns the whole node-level GPU
# stack: it installs and manages the driver, configures containerd, and runs its own
# `nvidia-gpu-device-plugin` in kube-system, and its node agent reconciles that configuration back.
# Running NVIDIA's GPU Operator alongside it does not add capability, it fails:
#
#   - container-toolkit's driver-validation never finds a driver, because the operator looks in
#     /run/nvidia/driver while GKE's lives in /home/kubernetes/bin/nvidia
#   - the operator stamps `runtimeClassName: nvidia` on every GPU-touching operand, and GKE's
#     containerd has no `nvidia` handler, so those pods never get a sandbox:
#     "no runtime for \"nvidia\" is configured"
#   - its device plugin contends with Google's for the same GPUs
#
# Take GPU capacity and metrics from GKE's own stack instead.
#
# This is for GKE's default COS pools with Google-managed drivers. A GKE Ubuntu pool created with
# gpu-driver-version=disabled is NVIDIA's supported GPU Operator path: use `gpuProvider: standard`
# there, which is also what the system-critical pod quota in step 0 exists for.
apiVersion: storage.loft.sh/v1
kind: App
metadata:
  name: runai-step-06-gpu-operator-skip
  labels:
    runai.loft.sh/infra: "true"
spec:
  displayName: '[Run:AI Step - 6] NVIDIA GPU Operator (skipped, provider-managed)'
  description: Installs no GPU Operator. Used when the cloud provider manages the node-level GPU stack.
  defaultNamespace: gpu-operator
  config:
    # A marker rather than an empty release, so `kubectl -n gpu-operator get cm` answers "where is
    # my GPU Operator" without anyone reading the Stack. The task's parameters are declared below
    # and deliberately unused; the gpu task passes the same set to either App.
    manifests: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: runai-gpu-operator-skipped
      data:
        reason: |
          The NVIDIA GPU Operator was intentionally not installed: this Stack was applied with
          gpuProvider=gke, so the node-level GPU stack is managed by the cloud provider.
          GPU capacity and metrics come from the provider's own driver and device plugin.
        gpuProvider: gke
  parameters:
    # Declared only so the gpu task can pass one parameter set to either App. Nothing reads them.
    - variable: driverEnabled
      label: Install the NVIDIA driver
      description: Ignored. The provider manages the driver.
      type: boolean
      defaultValue: "false"
    - variable: devicePluginEnabled
      label: Enable the device plugin
      description: Ignored. The provider runs its own device plugin.
      type: boolean
      defaultValue: "true"
    - variable: driverInstallDir
      label: Driver install directory
      description: Ignored. The provider chooses where its driver lives.
      type: string
      defaultValue: /run/nvidia/driver

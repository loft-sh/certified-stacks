# This file deploys the tenant Stack without `deploy.stacks`.
# Prefer `example/vcluster-template-with-runai-stack.yaml` for a cluster-template deployment.
#
# Apply this StackInstance to a tenant cluster, not the Control Plane Cluster.
# Apply the host foundation and tenant registration first.
#
# This Stack reads all values from synced Secrets. It needs almost no parameters.
# Copy the three `sync.fromHost.secrets.mappings` entries before you use this file.
# `discover` fails when a required Secret does not arrive.
#
# Name the StackInstance `runai`. The chart requires release `runai-cluster`.
apiVersion: storage.loft.sh/v1
kind: StackInstance
metadata:
  name: runai
spec:
  displayName: "NVIDIA Run:ai central-control-plane tenant"
  owner:
    user: admin
  destination:
    cluster:
      name: "<TENANT_CLUSTER>"
  templateRef:
    name: run-ai-central-control-plane
  # Defaults cover IngressClass `nginx` and waiting for the control plane's CA. Set this
  # only when the control plane serves a publicly trusted certificate, in which case no
  # `runai-ca-cert` is ever created and waiting for one would never return:
  # parameters:
  #   requireControlPlaneCA: "false"

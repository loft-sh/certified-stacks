# Applies the central-control-plane TENANT Stack directly, instead of letting the vCluster template own it through
# `deploy.stacks`. Use this only when driving the tenant Stack by hand; otherwise prefer
# `example/vcluster-template-with-runai-stack.yaml`.
#
# Destination is a tenant cluster, not the Control Plane Cluster. The shared host foundation
# (`example/stackinstance-host.yaml`) and this tenant's registration
# (`example/stackinstance-registration.yaml`) must both be in place first.
#
# There are no inputs to fill in, and that is the catch: this Stack reads everything from Secrets the
# tenant cluster template syncs in. A tenant cluster created WITHOUT those three
# `sync.fromHost.secrets.mappings` entries has nothing to read, and the `discover` task waits and then
# fails naming the Secret that never arrived. Copy the mappings out of
# `example/vcluster-template-with-runai-stack.yaml` before using this.
#
# Use StackInstance name `runai`: the cluster chart requires the Helm release `runai-cluster`, and the
# release name is derived from `<StackInstance name>-<task name>`.
apiVersion: storage.loft.sh/v1
kind: StackInstance
metadata:
  name: runai
spec:
  displayName: "run:ai central-control-plane tenant"
  owner:
    user: admin
  destination:
    cluster:
      name: "<TENANT_CLUSTER>"
  templateRef:
    name: run-ai-central-control-plane
  # No inputs. Defaults cover IngressClass `nginx` and waiting for the control plane's CA. Set this
  # only when the control plane serves a publicly trusted certificate, in which case no
  # `runai-ca-cert` is ever created and waiting for one would never return:
  # inputs:
  #   requireControlPlaneCA: "false"

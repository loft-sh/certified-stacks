# Step 3: the tenant cluster template. GENERATED by metered-inference/render.py from
# metered-inference/source/virtualclustertemplate.yaml. Edit that source, then re-run the script.
#
# Creates the metered-inference-kubevirt VirtualClusterTemplate with the endpoint settings fixed from
# the gateway Stack's contract, which the platform Stack's contract task reads, so tenants choose
# only the model, the API key, and the VMs. The cluster issuer and certificate verification follow
# from the TLS issuer: tenant clusters verify the endpoint's certificate only with Let's Encrypt
# production certificates, because they do not trust the self-signed or staging CAs.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: metered-inference-cluster-template
  labels:
    inference.vcluster.com/stack: platform
spec:
  displayName: '[Metered Inference Platform - 3] Tenant cluster template'
  description: Creates the Metered inference (KubeVirt) tenant cluster template, with the gateway Stack's endpoint settings filled in.
  defaultNamespace: inference-gateway
  config:
    manifests: |-
      {{- $domain := .Values.domain | default "" }}
      {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$" $domain) }}
      {{- fail (printf "domain %q is not a DNS name. The platform Stack reads it from the gateway Stack's contract." $domain) }}
      {{- end }}
      {{- $tls := .Values.tlsIssuer | default "" }}
      {{- if not (has $tls (list "self-signed" "letsencrypt" "letsencrypt-staging" "none")) }}
      {{- fail (printf "tlsIssuer %q is not one the gateway Stack supports" $tls) }}
      {{- end }}
      {{- $scheme := .Values.scheme | default "" }}
      {{- if ne $scheme (ternary "http" "https" (eq $tls "none")) }}
      {{- fail (printf "scheme %q does not match tlsIssuer %q" $scheme $tls) }}
      {{- end }}
      {{- $clusterIssuer := ternary "" "metered-inference" (eq $tls "none") }}
      {{- $verifyTLS := ternary "true" "false" (eq $tls "letsencrypt") }}
      {{- $pullSecret := .Values.jobImagePullSecret | default "" }}
      {{- if not (regexMatch "^$|^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $pullSecret) }}
      {{- fail (printf "jobImagePullSecret %q is not a Secret name" $pullSecret) }}
      {{- end }}
      apiVersion: management.loft.sh/v1
      kind: VirtualClusterTemplate
      metadata:
        name: metered-inference-kubevirt
        annotations:
          vcluster.com/template-icon: https://avatars.githubusercontent.com/u/232319222
      spec:
        displayName: Metered inference (KubeVirt)
        description: >-
          A tenant cluster on KubeVirt VMs serving one open-weights model on an OpenAI-compatible
          endpoint, published with its own hostname and certificate and token-metered by the control
          plane cluster's shared inference Gateway.
        owner:
          user: admin
        parameters:
          - variable: modelURL
            label: Model
            description: >-
              ollama://<model>:<tag>. In increasing order of quality and decreasing order of speed on CPU:
              ollama://qwen2.5:0.5b, ollama://llama3.2:1b, ollama://qwen2.5:1.5b, ollama://qwen2.5:3b.
            type: string
            required: true
            defaultValue: ollama://qwen2.5:1.5b
          - variable: modelId
            label: Model ID
            description: What clients send as `model`. A DNS-1123 label of at most 40 characters.
            type: string
            required: true
            defaultValue: qwen2-5-1-5b
            validation: '^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$'
          - variable: apiKey
            label: API key
            description: >-
              Bearer token clients must send, at least 16 characters, for example the output of
              `openssl rand -hex 24`. Leave empty for an open endpoint that anyone who finds the
              hostname can spend tokens on.
            type: password
            defaultValue: ""
            validation: '^$|^[A-Za-z0-9._~-]{16,256}$'
          - variable: nodeType
            label: VM size
            description: >-
              A node type of the KubeVirt NodeProvider. inference-large, which the platform Stack
              creates, is 6 vCPU and 8Gi and fits a 1.5B Ollama model, the chat UI, and the add-ons.
            type: string
            options:
              - inference-large
            defaultValue: inference-large
          - variable: nodeCount
            label: Number of VMs
            description: >-
              Keep at 1. Masquerade binding gives every VM the same address, so the VMs of one tenant
              cluster cannot reach each other.
            type: number
            defaultValue: "1"
            min: 1
            max: 4
          - variable: trafficGenerators
            label: Synthetic traffic
            description: Clients inside the tenant cluster that send a steady trickle of chat completions, so showback has something to show. 0 turns them off.
            type: number
            defaultValue: "0"
            min: 0
            max: 4
        template:
          instanceTemplate:
            metadata:
              annotations:
                loft.sh/custom-links: |
                  Inference API={{ $scheme }}://{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}/v1
                  Chat UI={{ $scheme }}://chat.{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}
          spaceTemplate:
            apps:
              # Runs in the tenant cluster's namespace on the control plane cluster.
              - name: metered-inference-endpoint
                parameters: |
                  apiHostname: "{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}"
                  chatHostname: "chat.{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}"
                  apiNodePort: "30080"
                  chatNodePort: "30081"
                  clusterIssuer: "{{ $clusterIssuer }}"
                  apiKey: "{{ "{{" }} .Values.apiKey {{ "}}" }}"
                  gatewayName: inference
                  gatewayNamespace: inference-gateway
                  vmNamespace: kubevirt
                  schedule: "* * * * *"
                  jobImagePullSecret: "{{ $pullSecret }}"
          helmRelease:
            chart:
              version: 0.37.2
            values: |
              controlPlane:
                backingStore:
                  etcd:
                    embedded:
                      enabled: true
                distro:
                  k8s:
                    version: v1.36.5
              privateNodes:
                enabled: true
                kubelet:
                  config:
                    kubeReserved:
                      cpu: "200m"
                      memory: "512Mi"
                      ephemeral-storage: "1Gi"
                    systemReserved:
                      cpu: "100m"
                      memory: "256Mi"
                    evictionHard:
                      memory.available: "300Mi"
                      nodefs.available: "10%"
                    serializeImagePulls: false
                    maxParallelImagePulls: 3
                autoNodes:
                  - provider: kubevirt
                    static:
                      - name: inference-pool
                        quantity: {{ "{{" }} .Values.nodeCount {{ "}}" }}
                        nodeTypeSelector:
                          - property: vcluster.com/node-type
                            operator: In
                            values:
                              - kubevirt.{{ "{{" }} .Values.nodeType {{ "}}" }}
              deploy:
                stacks:
                  - name: inference
                    templateRef:
                      name: metered-inference-kubeai
                    parameters:
                      modelURL: "{{ "{{" }} .Values.modelURL {{ "}}" }}"
                      modelId: "{{ "{{" }} .Values.modelId {{ "}}" }}"
                      engine: OLlama
                      engineArgs: ""
                      envVars: ""
                      resourceProfile: "cpu:1"
                      cpuRequest: "3"
                      memoryRequest: 3Gi
                      minReplicas: "1"
                      maxReplicas: "1"
                      apiURL: "{{ $scheme }}://{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}/v1"
                      chatURL: "{{ $scheme }}://chat.{{ "{{" }} .Values.loft.virtualClusterName {{ "}}" }}.{{ "{{" }} .Values.loft.project {{ "}}" }}.{{ $domain }}"
                      apiKey: "{{ "{{" }} .Values.apiKey {{ "}}" }}"
                      verifyTLS: "{{ $verifyTLS }}"
                      apiNodePort: "30080"
                      chatNodePort: "30081"
                      chatUI: "true"
                      meterChat: "true"
                      verifyPublicEndpoint: "true"
                      trafficGenerators: "{{ "{{" }} .Values.trafficGenerators {{ "}}" }}"
  parameters:
    - variable: domain
      label: Inference domain
      description: The gateway Stack's endpoint domain, from its contract.
      type: string
      required: true
    - variable: scheme
      label: Endpoint scheme
      type: string
      options:
        - https
        - http
    - variable: tlsIssuer
      label: TLS issuer
      type: string
      options:
        - self-signed
        - letsencrypt
        - letsencrypt-staging
        - none
    - variable: jobImagePullSecret
      label: Job image pull Secret
      description: Passed to each tenant cluster's endpoint App.
      type: string

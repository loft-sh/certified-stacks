# Step 2: the tenant Stack. GENERATED by metered-inference/render.py from
# metered-inference/tenant/apps/*.yaml and metered-inference/tenant/stacktemplate.yaml. Edit those
# sources, then re-run the script.
#
# Registers, through the Platform's management API, the metered-inference-kubeai StackTemplate that
# the tenant cluster template runs in every tenant cluster, its Apps, and the
# metered-inference-endpoint App the template runs in each tenant cluster's namespace. Their own
# templates are escaped, so this App's Helm render leaves them exactly as they are in the sources.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: metered-inference-tenant-stack
  labels:
    inference.vcluster.com/stack: platform
spec:
  displayName: '[Metered Inference Platform - 2] Tenant Stack'
  description: Registers the metered-inference-kubeai StackTemplate and the Apps tenant clusters use.
  defaultNamespace: inference-gateway
  config:
    manifests: |-
      apiVersion: management.loft.sh/v1
      kind: App
      metadata:
        name: metered-inference-endpoint
        labels:
          inference.vcluster.com/stack: kubeai
      spec:
        displayName: '[Metered Inference KubeAI] Tenant endpoint'
        description: Routes one tenant cluster's inference API and chat UI through the shared, token-metering inference Gateway.
        access:
          - users:
              - '*'
            verbs:
              - get
        config:
          manifests: |-
            {{ "{{" }}- /* From a spaceTemplate the Platform supplies the tenant identity; a hand-made AppInstance passes it. */{{ "}}" }}
            {{ "{{" }}- $loft := .Values.loft | default dict {{ "}}" }}
            {{ "{{" }}- $cluster := .Values.tenantCluster | default $loft.virtualClusterName | required "set tenantCluster, or deploy from a VirtualClusterTemplate spaceTemplate" {{ "}}" }}
            {{ "{{" }}- $project := .Values.project | default $loft.project | required "set project, or deploy from a VirtualClusterTemplate spaceTemplate" {{ "}}" }}
            {{ "{{" }}- $projectNamespace := .Values.projectNamespace | default $loft.projectNamespace | default (printf "p-%s" $project) {{ "}}" }}
            {{ "{{" }}- $ns := .Release.Namespace {{ "}}" }}
            {{ "{{" }}- $api := required "apiHostname is required" .Values.apiHostname {{ "}}" }}
            {{ "{{" }}- $chat := .Values.chatHostname | default "" {{ "}}" }}
            {{ "{{" }}- /* App parameter defaults do not reach an AppInstance, so an omitted issuer is the gateway's. */{{ "}}" }}
            {{ "{{" }}- $issuer := ternary (.Values.clusterIssuer | default "" | toString) "metered-inference" (hasKey .Values "clusterIssuer") {{ "}}" }}
            {{ "{{" }}- $gateway := .Values.gatewayName | default "inference" {{ "}}" }}
            {{ "{{" }}- $gatewayNamespace := .Values.gatewayNamespace | default "inference-gateway" {{ "}}" }}
            {{ "{{" }}- $vmNamespace := .Values.vmNamespace | default "kubevirt" {{ "}}" }}
            {{ "{{" }}- $apiPort := .Values.apiNodePort | default "30080" | toString {{ "}}" }}
            {{ "{{" }}- $chatPort := .Values.chatNodePort | default "30081" | toString {{ "}}" }}
            {{ "{{" }}- $routeSuffix := printf "%s.%s" $project $cluster {{ "}}" }}
            {{ "{{" }}- $rbacName := printf "metered-inference-endpoint-%s" $ns {{ "}}" }}
            apiVersion: v1
            kind: Service
            metadata:
              name: inference-api
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              type: ClusterIP
              ports:
                - name: http
                  port: 80
                  targetPort: {{ "{{" }} $apiPort {{ "}}" }}
                  protocol: TCP
            ---
            {{ "{{" }}- if $chat {{ "}}" }}
            apiVersion: v1
            kind: Service
            metadata:
              name: inference-chat
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              type: ClusterIP
              ports:
                - name: http
                  port: 80
                  targetPort: {{ "{{" }} $chatPort {{ "}}" }}
                  protocol: TCP
            ---
            {{ "{{" }}- end {{ "}}" }}
            apiVersion: agentgateway.dev/v1alpha1
            kind: AgentgatewayBackend
            metadata:
              name: inference-api
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              ai:
                provider:
                  openai: {}
                  host: inference-api.{{ "{{" }} $ns {{ "}}" }}.svc.cluster.local
                  port: 80
                  # KubeAI serves the OpenAI API under /openai/v1. The Gateway swaps a request's leading
                  # /v1 for this prefix.
                  pathPrefix: /openai/v1
              policies:
                ai:
                  routes:
                    /v1/chat/completions: Completions
                    /v1/embeddings: Embeddings
                    /v1/models: Passthrough
                    "*": Detect
            ---
            {{ "{{" }}- if .Values.apiKey {{ "}}" }}
            apiVersion: v1
            kind: Secret
            metadata:
              name: inference-api-keys
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            type: Opaque
            stringData:
              tenant: {{ "{{" }} .Values.apiKey | quote {{ "}}" }}
            ---
            apiVersion: agentgateway.dev/v1alpha1
            kind: AgentgatewayPolicy
            metadata:
              name: inference-api-key
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              targetRefs:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  name: api.{{ "{{" }} $routeSuffix {{ "}}" }}
              traffic:
                apiKeyAuthentication:
                  mode: Strict
                  secretRef:
                    name: inference-api-keys
            ---
            {{ "{{" }}- end {{ "}}" }}
            {{ "{{" }}- if $issuer {{ "}}" }}
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              secretName: inference-endpoint-tls
              dnsNames:
                - {{ "{{" }} $api | quote {{ "}}" }}
                {{ "{{" }}- if $chat {{ "}}" }}
                - {{ "{{" }} $chat | quote {{ "}}" }}
                {{ "{{" }}- end {{ "}}" }}
              privateKey:
                algorithm: ECDSA
                size: 256
                rotationPolicy: Always
              issuerRef:
                group: cert-manager.io
                kind: ClusterIssuer
                name: {{ "{{" }} $issuer {{ "}}" }}
            ---
            # This tenant's own HTTPS listeners on the shared Gateway, with its own certificate.
            apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ "{{" }} $gateway {{ "}}" }}
                namespace: {{ "{{" }} $gatewayNamespace {{ "}}" }}
              listeners:
                - name: api
                  hostname: {{ "{{" }} $api | quote {{ "}}" }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: inference-endpoint-tls
                {{ "{{" }}- if $chat {{ "}}" }}
                - name: chat
                  hostname: {{ "{{" }} $chat | quote {{ "}}" }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: inference-endpoint-tls
                {{ "{{" }}- end {{ "}}" }}
            ---
            {{ "{{" }}- end {{ "}}" }}
            # Rendered here so Helm owns the definition; the CronJob applies it (see the header).
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: inference-endpoint-routes
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            data:
              routes.yaml: |
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: api.{{ "{{" }} $routeSuffix {{ "}}" }}
                  namespace: {{ "{{" }} $ns {{ "}}" }}
                  labels:
                    app.kubernetes.io/name: inference-endpoint
                spec:
                  parentRefs:
                  {{ "{{" }}- if $issuer {{ "}}" }}
                    - group: gateway.networking.k8s.io
                      kind: ListenerSet
                      name: inference-endpoint
                      sectionName: api
                  {{ "{{" }}- else {{ "}}" }}
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      name: {{ "{{" }} $gateway {{ "}}" }}
                      namespace: {{ "{{" }} $gatewayNamespace {{ "}}" }}
                      sectionName: http
                  {{ "{{" }}- end {{ "}}" }}
                  hostnames:
                    - {{ "{{" }} $api | quote {{ "}}" }}
                  rules:
                    # OpenAI's own base path, which the Gateway maps onto KubeAI's /openai/v1.
                    - matches:
                        - path:
                            type: PathPrefix
                            value: /v1
                      backendRefs:
                        - group: agentgateway.dev
                          kind: AgentgatewayBackend
                          name: inference-api
                    # KubeAI's native base path, for clients configured against KubeAI directly.
                    - matches:
                        - path:
                            type: PathPrefix
                            value: /openai/v1
                      filters:
                        - type: URLRewrite
                          urlRewrite:
                            path:
                              type: ReplacePrefixMatch
                              replacePrefixMatch: /v1
                      backendRefs:
                        - group: agentgateway.dev
                          kind: AgentgatewayBackend
                          name: inference-api
                {{ "{{" }}- if $chat {{ "}}" }}
                ---
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: chat.{{ "{{" }} $routeSuffix {{ "}}" }}
                  namespace: {{ "{{" }} $ns {{ "}}" }}
                  labels:
                    app.kubernetes.io/name: inference-endpoint
                spec:
                  parentRefs:
                  {{ "{{" }}- if $issuer {{ "}}" }}
                    - group: gateway.networking.k8s.io
                      kind: ListenerSet
                      name: inference-endpoint
                      sectionName: chat
                  {{ "{{" }}- else {{ "}}" }}
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      name: {{ "{{" }} $gateway {{ "}}" }}
                      namespace: {{ "{{" }} $gatewayNamespace {{ "}}" }}
                      sectionName: http
                  {{ "{{" }}- end {{ "}}" }}
                  hostnames:
                    - {{ "{{" }} $chat | quote {{ "}}" }}
                  rules:
                    - backendRefs:
                        - name: inference-chat
                          port: 80
                {{ "{{" }}- end {{ "}}" }}
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
            rules:
              - apiGroups: ["discovery.k8s.io"]
                resources: ["endpointslices"]
                verbs: ["get", "list", "create", "update", "patch"]
              - apiGroups: ["gateway.networking.k8s.io"]
                resources: ["httproutes"]
                verbs: ["get", "list", "create", "update", "patch", "delete"]
              # VMs of node providers that place them in the tenant cluster's namespace.
              - apiGroups: ["kubevirt.io"]
                resources: ["virtualmachineinstances"]
                verbs: ["get"]
              # Its own UID, to own what it creates.
              - apiGroups: ["batch"]
                resources: ["cronjobs"]
                resourceNames: ["inference-endpoint"]
                verbs: ["get"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: inference-endpoint
            subjects:
              - kind: ServiceAccount
                name: inference-endpoint
                namespace: {{ "{{" }} $ns {{ "}}" }}
            ---
            # NodeClaims live in the Platform project namespace. Names carry the tenant cluster's
            # namespace because every tenant cluster in the project binds its own.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: {{ "{{" }} $rbacName {{ "}}" }}
              namespace: {{ "{{" }} $projectNamespace {{ "}}" }}
            rules:
              - apiGroups: ["storage.loft.sh"]
                resources: ["nodeclaims"]
                verbs: ["get", "list"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ "{{" }} $rbacName {{ "}}" }}
              namespace: {{ "{{" }} $projectNamespace {{ "}}" }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: {{ "{{" }} $rbacName {{ "}}" }}
            subjects:
              - kind: ServiceAccount
                name: inference-endpoint
                namespace: {{ "{{" }} $ns {{ "}}" }}
            ---
            # The KubeVirt node provider's VMs, shared by every tenant cluster it serves. Read-only. With
            # the provider's VirtualCluster namespace strategy the VMs are in the tenant namespace instead,
            # which the Role above covers.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: {{ "{{" }} $rbacName {{ "}}" }}
              namespace: {{ "{{" }} $vmNamespace {{ "}}" }}
            rules:
              - apiGroups: ["kubevirt.io"]
                resources: ["virtualmachineinstances"]
                verbs: ["get", "list"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ "{{" }} $rbacName {{ "}}" }}
              namespace: {{ "{{" }} $vmNamespace {{ "}}" }}
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: {{ "{{" }} $rbacName {{ "}}" }}
            subjects:
              - kind: ServiceAccount
                name: inference-endpoint
                namespace: {{ "{{" }} $ns {{ "}}" }}
            ---
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: inference-endpoint
              namespace: {{ "{{" }} $ns {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-endpoint
            spec:
              schedule: {{ "{{" }} .Values.schedule | default "* * * * *" | quote {{ "}}" }}
              concurrencyPolicy: Forbid
              successfulJobsHistoryLimit: 1
              failedJobsHistoryLimit: 2
              startingDeadlineSeconds: 120
              jobTemplate:
                spec:
                  backoffLimit: 0
                  activeDeadlineSeconds: 110
                  ttlSecondsAfterFinished: 600
                  template:
                    spec:
                      restartPolicy: Never
                      serviceAccountName: inference-endpoint
                      {{ "{{" }}- if .Values.jobImagePullSecret {{ "}}" }}
                      imagePullSecrets:
                        - name: {{ "{{" }} .Values.jobImagePullSecret | quote {{ "}}" }}
                      {{ "{{" }}- end {{ "}}" }}
                      securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                          type: RuntimeDefault
                      containers:
                        - name: reconcile
                          image: {{ "{{" }} .Values.__image__ | quote {{ "}}" }}
                          securityContext:
                            allowPrivilegeEscalation: false
                            readOnlyRootFilesystem: true
                            capabilities:
                              drop: ["ALL"]
                          resources:
                            requests:
                              cpu: 20m
                              memory: 64Mi
                            limits:
                              memory: 256Mi
                          env:
                            - name: HOME
                              value: /tmp
                            - name: KUBECACHEDIR
                              value: /tmp/.kube-cache
                            - name: NS
                              value: {{ "{{" }} $ns | quote {{ "}}" }}
                            - name: CLUSTER
                              value: {{ "{{" }} $cluster | quote {{ "}}" }}
                            - name: PROJECT_NAMESPACE
                              value: {{ "{{" }} $projectNamespace | quote {{ "}}" }}
                            - name: VM_NAMESPACE
                              value: {{ "{{" }} $vmNamespace | quote {{ "}}" }}
                            - name: API_PORT
                              value: {{ "{{" }} $apiPort | quote {{ "}}" }}
                            - name: CHAT_PORT
                              value: {{ "{{" }} if $chat {{ "}}" }}{{ "{{" }} $chatPort | quote {{ "}}" }}{{ "{{" }} else {{ "}}" }}""{{ "{{" }} end {{ "}}" }}
                          command: ["sh", "-c"]
                          args:
                            - |
                              set -eu
                              owner_uid=$(kubectl -n "$NS" get cronjob inference-endpoint -o jsonpath='{.metadata.uid}')
                              owner=$(jq -cn --arg uid "$owner_uid" \
                                '[{apiVersion: "batch/v1", kind: "CronJob", name: "inference-endpoint", uid: $uid}]')

                              # The tenant cluster's joined nodes, and each one's VM. Read the claims
                              # first, so an API error stops the run instead of emptying the endpoints.
                              claims=$(kubectl -n "$PROJECT_NAMESPACE" get nodeclaims.storage.loft.sh -o json)
                              vms=$(printf '%s' "$claims" | jq -r --arg c "$CLUSTER" --arg ns "$VM_NAMESPACE" '
                                .items[]
                                | select(.spec.vClusterRef == $c)
                                | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                                | .metadata.annotations["kubevirt.vcluster.com/vm-ref"] // ($ns + "/" + .metadata.name)')
                              addresses=""
                              for vm in $vms; do
                                if vmi=$(kubectl -n "${vm%%/*}" get virtualmachineinstances.kubevirt.io "${vm#*/}" -o json 2>/tmp/vmi.err); then
                                  address=$(printf '%s' "$vmi" | jq -r '
                                    select(.status.phase == "Running")
                                    | [.status.interfaces[]?.ipAddress // empty | select(test("^[0-9]+(\\.[0-9]+){3}$"))][0] // empty')
                                else
                                  echo "cannot read VirtualMachineInstance $vm: $(cat /tmp/vmi.err)"
                                  address=""
                                fi
                                if [ -n "$address" ]; then
                                  addresses="$addresses $address"
                                else
                                  echo "VM $vm has no running address yet"
                                fi
                              done
                              echo "tenant cluster $CLUSTER nodes:${addresses:- none}"

                              # One EndpointSlice per Service, replaced wholesale on every run.
                              slice() {
                                jq -n --arg name "$1" --arg ns "$NS" --argjson port "$2" --argjson owner "$owner" --arg addresses "$addresses" '{
                                  apiVersion: "discovery.k8s.io/v1", kind: "EndpointSlice",
                                  metadata: {
                                    name: $name, namespace: $ns, ownerReferences: $owner,
                                    labels: {
                                      "kubernetes.io/service-name": $name,
                                      "endpointslice.kubernetes.io/managed-by": "metered-inference-endpoint",
                                      "app.kubernetes.io/name": "inference-endpoint"
                                    }
                                  },
                                  addressType: "IPv4",
                                  ports: [{name: "http", port: $port, protocol: "TCP"}],
                                  endpoints: [$addresses | split(" ")[] | select(. != "") | {addresses: [.], conditions: {ready: true{{ "}}" }}]
                                }' | kubectl apply -f -
                              }
                              slice inference-api "$API_PORT"
                              [ -z "$CHAT_PORT" ] || slice inference-chat "$CHAT_PORT"

                              # HTTPRoutes: apply only when the rendered definition changes, so a rule
                              # that sleep mode added survives.
                              want=$(sha256sum /routes/routes.yaml | cut -c1-16)
                              # kubectl prints one JSON object per document, so slurp them into one array.
                              desired=$(kubectl create --dry-run=client -o json -f /routes/routes.yaml | jq -cs '
                                [.[] | if .kind == "List" then .items[] else . end]')
                              current=$(kubectl -n "$NS" get httproutes.gateway.networking.k8s.io -l app.kubernetes.io/name=inference-endpoint -o json)
                              stale=$(jq -n --argjson d "$desired" --argjson c "$current" --arg h "$want" '
                                ($d | map(.metadata.name)) as $names
                                | ($c.items | map(select(.metadata.annotations["inference.vcluster.com/spec-hash"] == $h) | .metadata.name)) as $fresh
                                | ($names - $fresh) | length')
                              if [ "$stale" -gt 0 ]; then
                                printf '%s' "$desired" | jq --arg h "$want" --argjson owner "$owner" '{
                                  apiVersion: "v1", kind: "List",
                                  items: map(.metadata.annotations["inference.vcluster.com/spec-hash"] = $h | .metadata.ownerReferences = $owner)
                                }' | kubectl apply -f -
                              else
                                echo "HTTPRoutes are current"
                              fi
                              # Routes no longer rendered, for example after removing the chat hostname.
                              for name in $(jq -rn --argjson d "$desired" --argjson c "$current" '
                                  ($d | map(.metadata.name)) as $names | $c.items[].metadata.name | select(. as $n | $names | index($n) | not)'); do
                                kubectl -n "$NS" delete httproute.gateway.networking.k8s.io "$name" --ignore-not-found
                              done
                          volumeMounts:
                            - name: routes
                              mountPath: /routes
                              readOnly: true
                            - name: tmp
                              mountPath: /tmp
                      volumes:
                        - name: routes
                          configMap:
                            name: inference-endpoint-routes
                        - name: tmp
                          emptyDir: {}
        parameters:
          - variable: apiHostname
            label: API hostname
            description: Public hostname of the tenant cluster's inference API, under the gateway Stack's endpoint domain.
            type: string
            required: true
          - variable: chatHostname
            label: Chat UI hostname
            description: Public hostname of the chat UI. Leave empty to publish no chat UI.
            type: string
          - variable: apiNodePort
            label: API node port
            description: Must match the metered-inference-kubeai Stack's apiNodePort.
            type: string
            defaultValue: "30080"
          - variable: chatNodePort
            label: Chat UI node port
            description: Must match the metered-inference-kubeai Stack's chatNodePort.
            type: string
            defaultValue: "30081"
          - variable: clusterIssuer
            label: Cluster issuer
            description: ClusterIssuer for the endpoint certificate, metered-inference from the gateway Stack. Leave empty when the gateway Stack uses tlsIssuer none.
            type: string
            defaultValue: metered-inference
          - variable: apiKey
            label: API key
            description: Key clients must send as a Bearer token. Leave empty for an open endpoint.
            type: password
          - variable: gatewayName
            label: Gateway name
            type: string
            defaultValue: inference
          - variable: gatewayNamespace
            label: Gateway namespace
            type: string
            defaultValue: inference-gateway
          - variable: vmNamespace
            label: KubeVirt VM namespace
            description: Namespace the KubeVirt node provider creates VMs in (its clusterRef.namespace).
            type: string
            defaultValue: kubevirt
          - variable: schedule
            label: Reconcile schedule
            type: string
            defaultValue: '* * * * *'
          - variable: jobImagePullSecret
            label: Job image pull Secret
            description: Secret in the tenant cluster's namespace that pulls the vCluster Platform image. Leave empty when the image pulls anonymously.
            type: string
          # Only for an AppInstance created by hand. From a spaceTemplate, the Platform supplies these.
          - variable: tenantCluster
            label: Tenant cluster
            description: Leave empty when deployed from a VirtualClusterTemplate spaceTemplate.
            type: string
          - variable: project
            label: Project
            description: Leave empty when deployed from a VirtualClusterTemplate spaceTemplate.
            type: string
          - variable: projectNamespace
            label: Project namespace
            description: Defaults to p-<project>.
            type: string
      ---
      apiVersion: management.loft.sh/v1
      kind: App
      metadata:
        name: metered-inference-kubeai
        labels:
          inference.vcluster.com/stack: kubeai
      spec:
        displayName: '[Metered Inference KubeAI] KubeAI'
        description: Installs KubeAI and Open WebUI, exposed on fixed node ports for the shared inference Gateway.
        defaultNamespace: kubeai
        wait: true
        timeout: 12m
        icon: https://raw.githubusercontent.com/kubeai-project/kubeai/main/docs/screenshots/kubeai-logo.png
        config:
          chart:
            name: kubeai
            repoURL: oci://ghcr.io/kubeai-project/charts
            version: 0.23.5
          values: |-
            service:
              type: NodePort
              port: 80
              nodePort: {{ "{{" }} .Values.apiNodePort | default "30080" {{ "}}" }}
            resourceProfiles:
              cpu:
                imageName: cpu
                requests:
                  cpu: {{ "{{" }} .Values.cpuRequest | default "3" | quote {{ "}}" }}
                  memory: {{ "{{" }} .Values.memoryRequest | default "3Gi" | quote {{ "}}" }}
              # One NVIDIA GPU per unit, for resourceProfile gpu:<count>. Needs the NVIDIA device plugin
              # (or GPU Operator) on the tenant cluster's nodes.
              gpu:
                imageName: nvidia-gpu
                requests:
                  cpu: {{ "{{" }} .Values.cpuRequest | default "3" | quote {{ "}}" }}
                  memory: {{ "{{" }} .Values.memoryRequest | default "3Gi" | quote {{ "}}" }}
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
                tolerations:
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
            modelAutoscaling:
              interval: 10s
              timeWindow: {{ "{{" }} .Values.scaleDownWindow | default "5m" {{ "}}" }}
            open-webui:
              enabled: {{ "{{" }} if eq (toString .Values.chatUI) "false" {{ "}}" }}false{{ "{{" }} else {{ "}}" }}true{{ "{{" }} end {{ "}}" }}
              fullnameOverride: open-webui
              ollama:
                enabled: false
              pipelines:
                enabled: false
              websocket:
                enabled: false
              # The public, metered endpoint when the Stack's meterChat is on, so chat is counted like any
              # client. Otherwise KubeAI directly.
              openaiBaseApiUrl: {{ "{{" }} .Values.chatBackendURL | default "http://kubeai/openai/v1" | quote {{ "}}" }}
              openaiApiKey: {{ "{{" }} .Values.apiKey | default "not-used" | quote {{ "}}" }}
              service:
                type: NodePort
                port: 80
                nodePort: {{ "{{" }} .Values.chatNodePort | default "30081" {{ "}}" }}
              persistence:
                enabled: false
              extraEnvVars:
                # No Open WebUI accounts: persistence is off, so they would not survive a restart.
                # Anyone who can reach the chat hostname can use the model. See the README.
                - name: WEBUI_AUTH
                  value: "False"
                - name: SHOW_ADMIN_DETAILS
                  value: "false"
                - name: SAFE_MODE
                  value: "true"
                - name: ENABLE_EVALUATION_ARENA_MODELS
                  value: "False"
                # "false" when the tenant cluster does not trust the endpoint's CA (self-signed or Let's
                # Encrypt staging).
                - name: AIOHTTP_CLIENT_SESSION_SSL
                  value: {{ "{{" }} if eq (toString .Values.chatBackendVerifyTLS) "false" {{ "}}" }}"false"{{ "{{" }} else {{ "}}" }}"true"{{ "{{" }} end {{ "}}" }}
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
        parameters:
          - variable: apiNodePort
            label: API node port
            description: Inside the node port range, 30000-32767 by default.
            type: string
            defaultValue: "30080"
            validation: '^3[0-9]{4}$'
          - variable: chatNodePort
            label: Chat UI node port
            type: string
            defaultValue: "30081"
            validation: '^3[0-9]{4}$'
          - variable: cpuRequest
            label: CPU per model replica
            description: Generation speed on CPU scales with cores up to the memory bandwidth limit. Leave the node a core for everything else.
            type: string
            defaultValue: "3"
          - variable: memoryRequest
            label: Memory per model replica
            description: Must exceed the model's size plus room for the context window.
            type: string
            defaultValue: 3Gi
          - variable: scaleDownWindow
            label: Scale-to-zero window
            type: string
            defaultValue: 5m
          - variable: chatUI
            label: Deploy the chat UI
            type: boolean
            defaultValue: "true"
          - variable: chatBackendURL
            label: Chat UI backend
            description: OpenAI-compatible base URL for Open WebUI.
            type: string
            defaultValue: http://kubeai/openai/v1
          - variable: chatBackendVerifyTLS
            label: Verify the chat backend's certificate
            type: string
            options:
              - "true"
              - "false"
            defaultValue: "true"
          - variable: apiKey
            label: API key
            description: Key Open WebUI sends to the metered endpoint.
            type: password
      ---
      apiVersion: management.loft.sh/v1
      kind: App
      metadata:
        name: metered-inference-model
        labels:
          inference.vcluster.com/stack: kubeai
      spec:
        displayName: '[Metered Inference KubeAI] Served model'
        description: Creates a KubeAI Model and waits until it answers, locally and through the shared inference Gateway.
        defaultNamespace: kubeai
        wait: true
        # Helm's wait on the report hook, which gives up after readyTimeoutSeconds. Keep
        # readyTimeoutSeconds < this < the model task's timeout, or a cold model pull fails the release
        # while the model is still loading.
        timeout: 17m
        config:
          manifests: |-
            apiVersion: kubeai.org/v1
            kind: Model
            metadata:
              name: {{ "{{" }} .Values.modelId {{ "}}" }}
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              labels:
                app.kubernetes.io/name: {{ "{{" }} .Values.modelId {{ "}}" }}
                app.kubernetes.io/managed-by: vcluster-platform
              annotations:
                inference.vcluster.com/source-url: {{ "{{" }} .Values.modelURL | quote {{ "}}" }}
            spec:
              features: [TextGeneration]
              url: {{ "{{" }} .Values.modelURL | quote {{ "}}" }}
              engine: {{ "{{" }} .Values.engine | default "OLlama" {{ "}}" }}
              resourceProfile: {{ "{{" }} .Values.resourceProfile | default "cpu:1" | quote {{ "}}" }}
            {{ "{{" }}- if .Values.envVars {{ "}}" }}
              env:
              {{ "{{" }}- range $pair := splitList "," .Values.envVars {{ "}}" }}
                {{ "{{" }} (splitn "=" 2 $pair)._0 | trim {{ "}}" }}: {{ "{{" }} (splitn "=" 2 $pair)._1 | trim | quote {{ "}}" }}
              {{ "{{" }}- end {{ "}}" }}
            {{ "{{" }}- end {{ "}}" }}
              minReplicas: {{ "{{" }} .Values.minReplicas | default "1" {{ "}}" }}
              maxReplicas: {{ "{{" }} .Values.maxReplicas | default "1" {{ "}}" }}
              targetRequests: {{ "{{" }} .Values.targetRequests | default "4" {{ "}}" }}
            {{ "{{" }}- if .Values.engineArgs {{ "}}" }}
              args:
              {{ "{{" }}- range $arg := splitList "," .Values.engineArgs {{ "}}" }}
                - {{ "{{" }} $arg | trim | quote {{ "}}" }}
              {{ "{{" }}- end {{ "}}" }}
            {{ "{{" }}- end {{ "}}" }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: inference-api-key
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
            type: Opaque
            stringData:
              # The key clients send as `Authorization: Bearer <key>`. Empty when the endpoint is open.
              key: {{ "{{" }} .Values.apiKey | default "" | quote {{ "}}" }}
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: {{ "{{" }} .Release.Name {{ "}}" }}-report
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "-5"
                helm.sh/hook-delete-policy: before-hook-creation
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: {{ "{{" }} .Release.Name {{ "}}" }}-report
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "-5"
                helm.sh/hook-delete-policy: before-hook-creation
            rules:
              - apiGroups: ["kubeai.org"]
                resources: ["models"]
                verbs: ["get", "list", "watch"]
              - apiGroups: [""]
                resources: ["services"]
                verbs: ["get", "list"]
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "create", "update", "patch"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ "{{" }} .Release.Name {{ "}}" }}-report
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "-5"
                helm.sh/hook-delete-policy: before-hook-creation
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: {{ "{{" }} .Release.Name {{ "}}" }}-report
            subjects:
              - kind: ServiceAccount
                name: {{ "{{" }} .Release.Name {{ "}}" }}-report
                namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: {{ "{{" }} .Release.Namespace {{ "}}" }}-{{ "{{" }} .Release.Name {{ "}}" }}-report
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "-5"
                helm.sh/hook-delete-policy: before-hook-creation
            rules:
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["get", "list"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: {{ "{{" }} .Release.Namespace {{ "}}" }}-{{ "{{" }} .Release.Name {{ "}}" }}-report
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "-5"
                helm.sh/hook-delete-policy: before-hook-creation
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: {{ "{{" }} .Release.Namespace {{ "}}" }}-{{ "{{" }} .Release.Name {{ "}}" }}-report
            subjects:
              - kind: ServiceAccount
                name: {{ "{{" }} .Release.Name {{ "}}" }}-report
                namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
            ---
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ "{{" }} .Release.Name {{ "}}" }}-report
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              annotations:
                helm.sh/hook: post-install,post-upgrade
                helm.sh/hook-weight: "10"
                helm.sh/hook-delete-policy: before-hook-creation
            spec:
              backoffLimit: 2
              ttlSecondsAfterFinished: 3600
              template:
                spec:
                  restartPolicy: Never
                  serviceAccountName: {{ "{{" }} .Release.Name {{ "}}" }}-report
                  containers:
                    - name: report
                      image: {{ "{{" }} .Values.toolsImage | default "alpine/kubectl:1.36.4" | quote {{ "}}" }}
                      env:
                        - name: MODEL
                          value: {{ "{{" }} .Values.modelId | quote {{ "}}" }}
                        - name: NS
                          value: {{ "{{" }} .Release.Namespace | quote {{ "}}" }}
                        - name: MIN_REPLICAS
                          value: {{ "{{" }} .Values.minReplicas | default "1" | toString | quote {{ "}}" }}
                        - name: READY_TIMEOUT
                          value: {{ "{{" }} .Values.readyTimeoutSeconds | default "900" | toString | quote {{ "}}" }}
                        - name: API_SERVICE
                          value: {{ "{{" }} .Values.apiServiceName | default "kubeai" | quote {{ "}}" }}
                        - name: CHAT_SERVICE
                          value: {{ "{{" }} .Values.chatServiceName | default "open-webui" | quote {{ "}}" }}
                        - name: REPORT
                          value: {{ "{{" }} .Values.reportName | default "inference-report" | quote {{ "}}" }}
                        - name: API_URL
                          value: {{ "{{" }} .Values.apiURL | quote {{ "}}" }}
                        - name: CHAT_URL
                          value: {{ "{{" }} .Values.chatURL | default "" | quote {{ "}}" }}
                        - name: VERIFY_PUBLIC
                          value: {{ "{{" }} .Values.verifyPublicEndpoint | default "false" | toString | quote {{ "}}" }}
                        - name: VERIFY_TLS
                          value: {{ "{{" }} if eq (toString .Values.verifyTLS) "false" {{ "}}" }}"false"{{ "{{" }} else {{ "}}" }}"true"{{ "{{" }} end {{ "}}" }}
                        - name: API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: inference-api-key
                              key: key
                      command: [/bin/sh, -ec]
                      args:
                        - |
                          DEADLINE=$(( $(date +%s) + READY_TIMEOUT ))
                          left() { [ "$(date +%s)" -lt "${DEADLINE}" ]; }

                          echo "waiting for ${MODEL} to be listed on the OpenAI endpoint"
                          until wget -q -O- "http://${API_SERVICE}.${NS}.svc.cluster.local/openai/v1/models" 2>/dev/null \
                                | grep -q "\"id\":\"${MODEL}\""; do
                            left || { echo "timed out waiting for ${MODEL} on /v1/models"; exit 1; }
                            sleep 10
                          done
                          echo "${MODEL} is registered"

                          if [ "${MIN_REPLICAS}" -gt 0 ]; then
                            echo "waiting for a ready replica"
                            until [ "$(kubectl get model "${MODEL}" -n "${NS}" -o jsonpath='{.status.replicas.ready}' 2>/dev/null || echo 0)" -ge 1 ]; do
                              left || { echo "timed out waiting for a ready replica of ${MODEL}"; exit 1; }
                              echo " ... $(kubectl get model "${MODEL}" -n "${NS}" -o jsonpath='{.status.replicas}' 2>/dev/null)"
                              sleep 15
                            done
                            echo "a replica is ready"
                          fi

                          # Any Ready node will do: a node port answers on every node.
                          NODE_IP=$(kubectl get nodes \
                            -o jsonpath='{range .items[?(@.status.conditions[-1].status=="True")]}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
                            2>/dev/null | head -n1)
                          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
                          [ -n "${NODE_IP}" ] || { echo "no Ready node with an InternalIP"; exit 1; }

                          API_PORT=$(kubectl get svc "${API_SERVICE}" -n "${NS}" -o jsonpath='{.spec.ports[0].nodePort}')
                          [ -n "${API_PORT}" ] || { echo "${API_SERVICE} has no nodePort; is its Service type NodePort?"; exit 1; }
                          CHAT_PORT=$(kubectl get svc "${CHAT_SERVICE}" -n "${NS}" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || true)
                          echo "node ${NODE_NAME} at ${NODE_IP}, api ${API_PORT}, chat ${CHAT_PORT:-none}"

                          echo "checking the node port answers on ${NODE_IP}:${API_PORT}"
                          until wget -q -O- "http://${NODE_IP}:${API_PORT}/openai/v1/models" 2>/dev/null | grep -q '"object":"list"'; do
                            left || { echo "no answer on ${NODE_IP}:${API_PORT}"; exit 1; }
                            sleep 10
                          done
                          echo "node port is answering"

                          if [ "${VERIFY_PUBLIC}" = "true" ]; then
                            echo "checking ${API_URL}/models through the shared Gateway"
                            TLS=""
                            [ "${VERIFY_TLS}" = "true" ] || TLS="--no-check-certificate"
                            public_models() {
                              if [ -n "${API_KEY}" ]; then
                                wget -q -O- ${TLS} --header "Authorization: Bearer ${API_KEY}" "${API_URL}/models"
                              else
                                wget -q -O- ${TLS} "${API_URL}/models"
                              fi
                            }
                            until public_models 2>/dev/null | grep -q "\"id\":\"${MODEL}\""; do
                              left || { echo "${API_URL}/models did not list ${MODEL}. Check the metered-inference-endpoint CronJob in the tenant cluster's namespace on the control plane cluster, DNS for the hostname, and its certificate."; exit 1; }
                              sleep 15
                            done
                            echo "public endpoint is answering"
                          fi

                          kubectl create configmap "${REPORT}" -n "${NS}" \
                            --from-literal=publicURL="${API_URL}" \
                            --from-literal=publicChatURL="${CHAT_URL}" \
                            --from-literal=internalURL="http://${API_SERVICE}.${NS}.svc.cluster.local/openai/v1" \
                            --from-literal=modelId="${MODEL}" \
                            --from-literal=nodeIP="${NODE_IP}" \
                            --from-literal=nodeName="${NODE_NAME}" \
                            --dry-run=client -o yaml | kubectl apply -f -
                          echo "wrote ${REPORT}"
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
        parameters:
          - variable: modelId
            label: Model ID
            description: What clients send as `model`, and the Model object's name. A DNS-1123 label of at most 40 characters, which KubeAI enforces.
            type: string
            required: true
            validation: '^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$'
          - variable: modelURL
            label: Model source URL
            type: string
            required: true
            defaultValue: ollama://qwen2.5:1.5b
          - variable: engine
            label: Serving engine
            type: string
            options:
              - OLlama
              - VLLM
            defaultValue: OLlama
          - variable: resourceProfile
            label: Resource profile
            description: KubeAI resource profile and multiplier, cpu:1 or gpu:<count>.
            type: string
            defaultValue: cpu:1
            validation: '^(cpu:1|gpu:[1-8])$'
          - variable: engineArgs
            label: Engine arguments
            description: Comma-separated flags for the model server. Empty for Ollama.
            type: string
          - variable: envVars
            label: Engine environment
            description: Comma-separated KEY=VALUE pairs set on the model server.
            type: string
          - variable: minReplicas
            label: Minimum replicas
            type: number
            defaultValue: "1"
            min: 0
            max: 4
          - variable: maxReplicas
            label: Maximum replicas
            type: number
            defaultValue: "1"
            min: 1
            max: 4
          - variable: targetRequests
            label: Target requests per replica
            type: number
            defaultValue: "4"
            min: 1
            max: 128
          - variable: apiURL
            label: Public API URL
            description: The tenant cluster's OpenAI-compatible base URL through the shared Gateway, ending in /v1.
            type: string
            required: true
          - variable: chatURL
            label: Public chat URL
            type: string
          - variable: apiKey
            label: API key
            type: password
          - variable: verifyPublicEndpoint
            label: Verify the public endpoint
            description: Also wait until the public API URL lists the model through the shared Gateway.
            type: boolean
            defaultValue: "false"
          - variable: verifyTLS
            label: Verify the endpoint's certificate
            description: false when the Gateway's certificate comes from the self-signed or Let's Encrypt staging issuer.
            type: boolean
            defaultValue: "true"
          - variable: apiServiceName
            label: API Service name
            type: string
            defaultValue: kubeai
          - variable: chatServiceName
            label: Chat UI Service name
            type: string
            defaultValue: open-webui
          - variable: reportName
            label: Report ConfigMap name
            type: string
            defaultValue: inference-report
          - variable: readyTimeoutSeconds
            label: Readiness timeout
            description: Must be comfortably under the Helm timeout of 17 minutes.
            type: number
            defaultValue: "900"
          - variable: toolsImage
            label: Tools image
            description: Any image with kubectl and a busybox wget with TLS.
            type: string
            defaultValue: alpine/kubectl:1.36.4
      ---
      apiVersion: management.loft.sh/v1
      kind: App
      metadata:
        name: metered-inference-traffic
        labels:
          inference.vcluster.com/stack: kubeai
      spec:
        displayName: '[Metered Inference KubeAI] Traffic generator'
        description: Sends a steady trickle of chat completions to the tenant cluster's metered endpoint.
        defaultNamespace: kubeai
        config:
          manifests: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: inference-traffic-prompts
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-traffic
            data:
              # One per line, with no double quotes or backslashes: each is dropped into a JSON string as-is.
              prompts.txt: |
                Explain what a Kubernetes tenant cluster is in two sentences.
                Write a haiku about scaling to zero.
                List five things to check when a pod is stuck in Pending.
                Summarise the difference between a Deployment and a StatefulSet.
                Suggest three names for a GPU cloud aimed at startups.
                Describe how an OpenAI-compatible chat completion request is structured.
                Write a short product announcement for a managed inference service.
                What are the trade-offs of running models on CPU instead of GPU?
                Explain token-based pricing to a finance team.
                Give a one-paragraph history of container orchestration.
                Write a limerick about a noisy neighbour on a shared cluster.
                Explain what a KV cache does during text generation.
                Draft a friendly reminder that the staging cluster is being rebuilt tonight.
                Compare chargeback and showback in three bullet points.
                Describe a good naming convention for Kubernetes namespaces.
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: inference-traffic
              namespace: {{ "{{" }} .Release.Namespace {{ "}}" }}
              labels:
                app.kubernetes.io/name: inference-traffic
            spec:
              replicas: {{ "{{" }} .Values.replicas | default "0" {{ "}}" }}
              selector:
                matchLabels:
                  app.kubernetes.io/name: inference-traffic
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: inference-traffic
                spec:
                  containers:
                    - name: client
                      image: {{ "{{" }} .Values.image | default "curlimages/curl:8.22.0" | quote {{ "}}" }}
                      command: [/bin/sh, -c]
                      args:
                        - |
                          rnd() { od -An -N2 -tu2 /dev/urandom | tr -d ' '; }
                          COUNT=$(grep -c . /prompts/prompts.txt)
                          TLS=""
                          [ "${VERIFY_TLS}" = "true" ] || TLS="-k"
                          echo "sending ${MODEL} completions to ${TARGET_URL}"
                          while true; do
                            PROMPT=$(sed -n "$(( $(rnd) % COUNT + 1 ))p" /prompts/prompts.txt)
                            TOKENS=$(( 32 + $(rnd) % (MAX_TOKENS - 31) ))
                            if [ $(( $(rnd) % 2 )) -eq 0 ]; then STREAM=true; else STREAM=false; fi
                            BODY="{\"model\":\"${MODEL}\",\"max_tokens\":${TOKENS},\"stream\":${STREAM},\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT}\"}]}"
                            if [ -n "${API_KEY}" ]; then
                              RESULT=$(curl -s ${TLS} --max-time 600 -o /dev/null -w '%{http_code} in %{time_total}s' \
                                -H 'Content-Type: application/json' -H "Authorization: Bearer ${API_KEY}" \
                                -d "${BODY}" "${TARGET_URL}/chat/completions") || RESULT="failed with curl exit code $?"
                            else
                              RESULT=$(curl -s ${TLS} --max-time 600 -o /dev/null -w '%{http_code} in %{time_total}s' \
                                -H 'Content-Type: application/json' \
                                -d "${BODY}" "${TARGET_URL}/chat/completions") || RESULT="failed with curl exit code $?"
                            fi
                            echo "$(date -u +%H:%M:%S) stream=${STREAM} max_tokens=${TOKENS}: ${RESULT}"
                            sleep $(( MIN_PAUSE + $(rnd) % (MAX_PAUSE - MIN_PAUSE + 1) ))
                          done
                      env:
                        - name: TARGET_URL
                          value: {{ "{{" }} .Values.targetURL | quote {{ "}}" }}
                        - name: MODEL
                          value: {{ "{{" }} .Values.modelId | quote {{ "}}" }}
                        - name: MAX_TOKENS
                          value: {{ "{{" }} .Values.maxTokens | default "256" | toString | quote {{ "}}" }}
                        - name: MIN_PAUSE
                          value: {{ "{{" }} .Values.minPauseSeconds | default "5" | toString | quote {{ "}}" }}
                        - name: MAX_PAUSE
                          value: {{ "{{" }} .Values.maxPauseSeconds | default "30" | toString | quote {{ "}}" }}
                        - name: VERIFY_TLS
                          value: {{ "{{" }} if eq (toString .Values.verifyTLS) "false" {{ "}}" }}"false"{{ "{{" }} else {{ "}}" }}"true"{{ "{{" }} end {{ "}}" }}
                        # Created by the model task.
                        - name: API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: inference-api-key
                              key: key
                      volumeMounts:
                        - name: prompts
                          mountPath: /prompts
                      resources:
                        requests:
                          cpu: 10m
                          memory: 16Mi
                  volumes:
                    - name: prompts
                      configMap:
                        name: inference-traffic-prompts
        parameters:
          - variable: targetURL
            label: API base URL
            description: OpenAI-compatible base URL, ending in /v1.
            type: string
            required: true
          - variable: modelId
            label: Model ID
            type: string
            required: true
          - variable: replicas
            label: Clients
            description: Each waits for its answer before sending the next request. 0 stops them.
            type: number
            defaultValue: "0"
            min: 0
            max: 8
          - variable: maxTokens
            label: Longest answer
            description: Each request asks for between 32 and this many output tokens.
            type: number
            defaultValue: "256"
            min: 33
            max: 4096
          - variable: minPauseSeconds
            label: Shortest pause
            type: number
            defaultValue: "5"
            min: 0
          - variable: maxPauseSeconds
            label: Longest pause
            type: number
            defaultValue: "30"
            min: 0
          - variable: verifyTLS
            label: Verify the endpoint's certificate
            type: boolean
            defaultValue: "true"
          - variable: image
            label: Client image
            description: Anything with a POSIX shell, curl, and od.
            type: string
            defaultValue: curlimages/curl:8.22.0
      ---
      apiVersion: management.loft.sh/v1
      kind: StackTemplate
      metadata:
        name: metered-inference-kubeai
      spec:
        displayName: Metered inference (KubeAI)
        icon: https://avatars.githubusercontent.com/u/232319222
        description: >-
          Serves one open-weights model on a tenant cluster with KubeAI, with Open WebUI as a chat front
          end, published and token-metered through the control plane cluster's shared inference Gateway.
        parameters:
          # Model.
          - variable: modelURL
            label: Model
            description: >-
              ollama://<model>:<tag> for engine OLlama, hf://<org>/<model> for VLLM. Ollama pulls
              pre-quantised weights, which is what fits a CPU node: about 1GB for a 1.5B model. In
              increasing order of quality and decreasing order of speed: ollama://qwen2.5:0.5b,
              ollama://llama3.2:1b, ollama://qwen2.5:1.5b, ollama://qwen2.5:3b.
            type: string
            required: true
            defaultValue: ollama://qwen2.5:1.5b
            validation: '^(ollama|hf|s3|gs|oss|pvc)://.+$'
          - variable: modelId
            label: Model ID
            description: What clients send as `model`. A DNS-1123 label of at most 40 characters, so not the Ollama tag verbatim.
            type: string
            required: true
            defaultValue: qwen2-5-1-5b
            validation: '^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$'
          - variable: engine
            label: Serving engine
            description: OLlama for ollama:// models. VLLM for hf:// models; it needs far more memory, or a GPU.
            type: string
            options:
              - OLlama
              - VLLM
            defaultValue: OLlama
          - variable: engineArgs
            label: Engine arguments
            description: Comma-separated model server flags. Empty for Ollama; vLLM might want --max-model-len=4096.
            type: string
            defaultValue: ""
          - variable: envVars
            label: Engine environment
            description: Comma-separated KEY=VALUE pairs for the model server, for example VLLM_CPU_KVCACHE_SPACE=2.
            type: string
            defaultValue: ""
          - variable: resourceProfile
            label: Resource profile
            description: cpu:1, or gpu:<count> for NVIDIA GPUs (the tenant cluster needs the NVIDIA device plugin).
            type: string
            defaultValue: cpu:1
            validation: '^(cpu:1|gpu:[1-8])$'
          - variable: cpuRequest
            label: CPU per model replica
            type: string
            defaultValue: "3"
          - variable: memoryRequest
            label: Memory per model replica
            type: string
            defaultValue: 3Gi
          - variable: minReplicas
            label: Minimum replicas
            description: 1 answers immediately. 0 scales to zero when idle; the cold start is a model reload, not a node provision.
            type: number
            defaultValue: "1"
            min: 0
            max: 4
          - variable: maxReplicas
            label: Maximum replicas
            type: number
            defaultValue: "1"
            min: 1
            max: 4

          # Endpoints. The tenant cluster template computes these from the gateway Stack's domain.
          - variable: apiURL
            label: Public API URL
            description: The tenant cluster's OpenAI-compatible base URL through the shared Gateway, ending in /v1.
            type: string
            required: true
            validation: '^https?://[^/]+/v1$'
          - variable: chatURL
            label: Public chat URL
            description: Where the chat UI is published. Empty when there is none.
            type: string
            defaultValue: ""
          - variable: apiKey
            label: API key
            description: >-
              Bearer token the Gateway requires on the API. Must match the metered-inference-endpoint
              App's apiKey. Empty for an open endpoint.
            type: password
            defaultValue: ""
            validation: '^$|^[A-Za-z0-9._~-]{16,256}$'
          - variable: verifyTLS
            label: Verify the endpoint's certificate
            description: false unless the gateway Stack uses the letsencrypt issuer. This tenant cluster does not trust the self-signed or Let's Encrypt staging CA.
            type: boolean
            defaultValue: "true"
          - variable: apiNodePort
            label: API node port
            description: Must match the metered-inference-endpoint App's apiNodePort.
            type: string
            defaultValue: "30080"
            validation: '^3[0-9]{4}$'
          - variable: chatNodePort
            label: Chat UI node port
            type: string
            defaultValue: "30081"
            validation: '^3[0-9]{4}$'

          # Chat UI and checks.
          - variable: chatUI
            label: Deploy the chat UI
            type: boolean
            defaultValue: "true"
          - variable: meterChat
            label: Meter the chat UI
            description: Send Open WebUI's requests through the public, metered endpoint rather than straight to KubeAI.
            type: boolean
            defaultValue: "true"
          - variable: verifyPublicEndpoint
            label: Wait for the public endpoint
            description: >-
              Keep the model task pending until the public API URL answers through the Gateway. This
              proves DNS, the certificate, and the control plane cluster side end to end.
            type: boolean
            defaultValue: "false"
          - variable: trafficGenerators
            label: Synthetic traffic
            description: Clients inside the tenant cluster that keep sending chat completions to the public API. 0 turns them off.
            type: number
            defaultValue: "0"
            min: 0
            max: 4

        tasks:
          - name: kubeai
            timeout: 15m
            app:
              templateRef:
                name: metered-inference-kubeai
              parameters:
                apiNodePort: "{{ "{{" }} .Values.apiNodePort {{ "}}" }}"
                chatNodePort: "{{ "{{" }} .Values.chatNodePort {{ "}}" }}"
                cpuRequest: "{{ "{{" }} .Values.cpuRequest {{ "}}" }}"
                memoryRequest: "{{ "{{" }} .Values.memoryRequest {{ "}}" }}"
                scaleDownWindow: 5m
                chatUI: "{{ "{{" }} .Values.chatUI {{ "}}" }}"
                chatBackendURL: '{{ "{{" }} if .Values.meterChat {{ "}}" }}{{ "{{" }} .Values.apiURL {{ "}}" }}{{ "{{" }} else {{ "}}" }}http://kubeai/openai/v1{{ "{{" }} end {{ "}}" }}'
                chatBackendVerifyTLS: "{{ "{{" }} .Values.verifyTLS {{ "}}" }}"
                apiKey: "{{ "{{" }} .Values.apiKey {{ "}}" }}"

          - name: model
            dependsOn: [kubeai]
            timeout: 20m
            app:
              templateRef:
                name: metered-inference-model
              parameters:
                modelId: "{{ "{{" }} .Values.modelId {{ "}}" }}"
                modelURL: "{{ "{{" }} .Values.modelURL {{ "}}" }}"
                engine: "{{ "{{" }} .Values.engine {{ "}}" }}"
                engineArgs: "{{ "{{" }} .Values.engineArgs {{ "}}" }}"
                envVars: "{{ "{{" }} .Values.envVars {{ "}}" }}"
                resourceProfile: "{{ "{{" }} .Values.resourceProfile {{ "}}" }}"
                minReplicas: "{{ "{{" }} .Values.minReplicas {{ "}}" }}"
                maxReplicas: "{{ "{{" }} .Values.maxReplicas {{ "}}" }}"
                targetRequests: "4"
                apiURL: "{{ "{{" }} .Values.apiURL {{ "}}" }}"
                chatURL: "{{ "{{" }} .Values.chatURL {{ "}}" }}"
                apiKey: "{{ "{{" }} .Values.apiKey {{ "}}" }}"
                verifyPublicEndpoint: "{{ "{{" }} .Values.verifyPublicEndpoint {{ "}}" }}"
                verifyTLS: "{{ "{{" }} .Values.verifyTLS {{ "}}" }}"
                apiServiceName: kubeai
                chatServiceName: open-webui
                reportName: inference-report
                readyTimeoutSeconds: "900"
                toolsImage: alpine/kubectl:1.36.4
            outputs:
              - name: publicurl
                fromResource:
                  apiVersion: v1
                  kind: ConfigMap
                  namespace: kubeai
                  name: inference-report
                  jsonPath: "{.data.publicURL}"
              - name: publicchaturl
                fromResource:
                  apiVersion: v1
                  kind: ConfigMap
                  namespace: kubeai
                  name: inference-report
                  jsonPath: "{.data.publicChatURL}"
              - name: internalurl
                fromResource:
                  apiVersion: v1
                  kind: ConfigMap
                  namespace: kubeai
                  name: inference-report
                  jsonPath: "{.data.internalURL}"
              - name: modelid
                fromResource:
                  apiVersion: v1
                  kind: ConfigMap
                  namespace: kubeai
                  name: inference-report
                  jsonPath: "{.data.modelId}"

          - name: traffic
            dependsOn: [model]
            timeout: 5m
            app:
              templateRef:
                name: metered-inference-traffic
              parameters:
                targetURL: "{{ "{{" }} .Values.apiURL {{ "}}" }}"
                modelId: "{{ "{{" }} .Values.modelId {{ "}}" }}"
                replicas: "{{ "{{" }} .Values.trafficGenerators {{ "}}" }}"
                # A Stack task passes only what it names, so the App's own defaults are repeated here.
                maxTokens: "256"
                minPauseSeconds: "5"
                maxPauseSeconds: "30"
                verifyTLS: "{{ "{{" }} .Values.verifyTLS {{ "}}" }}"
                image: curlimages/curl:8.22.0

        publishedOutputs:
          - name: inferenceEndpoint
            fromTask: {task: model, output: publicurl}
          - name: chatUI
            fromTask: {task: model, output: publicchaturl}
          - name: internalEndpoint
            fromTask: {task: model, output: internalurl}
          - name: modelID
            fromTask: {task: model, output: modelid}
  parameters: []

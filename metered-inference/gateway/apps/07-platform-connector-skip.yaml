# Step 7, skipped. The connector task selects this App when `platformIntegration` is false:
# Prometheus and Grafana run standalone, for platform administrators only.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: metered-inference-platform-connector-skip
  labels:
    inference.vcluster.com/stack: gateway
spec:
  displayName: '[Metered Inference Gateway - 7] Platform observability connector (skipped)'
  description: Registers nothing. Used when Grafana is standalone and admin-only.
  defaultNamespace: inference-observability
  config:
    manifests: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: metered-inference-platform-connector-skipped
      data:
        reason: |
          platformIntegration=false: token metrics are not exposed through vCluster Platform, and
          tenants do not see them in their Observability tab. Grafana is admin-only; reach it with
          kubectl port-forward -n inference-observability svc/metered-inference-grafana 3000:80
  # Declared so the connector task can pass one parameter set to either App. Nothing reads them.
  parameters:
    - variable: platformHost
      label: Platform host
      type: string
    - variable: platformNamespace
      label: Platform namespace
      type: string
    - variable: jobImagePullSecret
      label: Job image pull Secret
      type: string

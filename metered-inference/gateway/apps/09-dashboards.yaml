                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "justifyMode": "auto",
                  "orientation": "auto",
                  "textMode": "value",
                  "wideLayout": true,
                  "showPercentChange": false,
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: metered-inference-tenant-dashboard
        namespace: {{ $ns }}
        labels:
          grafana_dashboard: metered-inference
      data:
        tenant-usage.json: |-
          {
            "uid": "vcluster-cluster-observability",
            "title": "Metered inference / Tenant cluster usage",
            "description": "Tokens this tenant cluster served through the shared inference Gateway, priced at an editable rate card.",
            "tags": [
              "metered-inference",
              "showback",
              "tenant"
            ],
            "editable": false,
            "graphTooltip": 1,
            "refresh": "auto",
            "schemaVersion": 42,
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "timepicker": {},
            "annotations": {
              "list": []
            },
            "links": [],
            "templating": {
              "list": [
                {
                  "name": "datasource",
                  "label": "Data source",
                  "type": "datasource",
                  "query": "prometheus",
                  "current": {},
                  "hide": 2,
                  "refresh": 1,
                  "options": []
                },
                {
                  "name": "model",
                  "label": "Model",
                  "type": "query",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "definition": "label_values(vcluster_platform_tenant:agentgateway_gen_ai_client_token_usage_count, gen_ai_request_model)",
                  "query": {
                    "qryType": 1,
                    "query": "label_values(vcluster_platform_tenant:agentgateway_gen_ai_client_token_usage_count, gen_ai_request_model)",
                    "refId": "PrometheusVariableQueryEditor-VariableQuery"
                  },
                  "regex": "",
                  "refresh": 2,
                  "sort": 1,
                  "multi": true,
                  "includeAll": true,
                  "allValue": ".*",
                  "current": {
                    "text": [
                      "All"
                    ],
                    "value": [
                      "$__all"
                    ]
                  },
                  "options": [],
                  "hide": 0
                },
                {
                  "name": "input_price",
                  "label": "Input $ / 1M tokens",
                  "type": "textbox",
                  "query": "{{ .Values.inputPricePerMillion | default "0.20" }}",
                  "current": {
                    "text": "{{ .Values.inputPricePerMillion | default "0.20" }}",
                    "value": "{{ .Values.inputPricePerMillion | default "0.20" }}"
                  },
                  "hide": 0
                },
                {
                  "name": "output_price",
                  "label": "Output $ / 1M tokens",
                  "type": "textbox",
                  "query": "{{ .Values.outputPricePerMillion | default "0.60" }}",
                  "current": {
                    "text": "{{ .Values.outputPricePerMillion | default "0.60" }}",
                    "value": "{{ .Values.outputPricePerMillion | default "0.60" }}"
                  },
                  "hide": 0
                }
              ]
            },
            "panels": [
              {
                "type": "row",
                "title": "Usage",
                "id": 1,
                "collapsed": false,
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 24,
                  "h": 1
                },
                "panels": []
              },
              {
                "type": "stat",
                "title": "Tokens",
                "description": "Input plus output tokens this tenant cluster served in the selected range.",
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        }
                      ]
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "justifyMode": "auto",
                  "orientation": "auto",
                  "textMode": "value",
                  "wideLayout": true,
                  "showPercentChange": false,
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "",
                    "values": false
                  }
                },
                "targets": [
                  {
                    "expr": "sum(increase(vcluster_platform_tenant:agentgateway_gen_ai_client_token_usage_sum{gen_ai_request_model=~\"${model:regex}\", gen_ai_token_type=~\"input|output\"}[$__range]))",
                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "instant": true,
                    "range": false
                  }
                ],
                "id": 2,
                "gridPos": {
                  "x": 0,
                  "y": 1,
                  "w": 5,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                }
              },
              {
                "type": "stat",
                "title": "Input tokens",
                "description": "Prompt tokens in the selected range.",
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "#48B5FF"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#48B5FF",
                          "value": null
                        }
                      ]
                    }
                  },
                  "overrides": []

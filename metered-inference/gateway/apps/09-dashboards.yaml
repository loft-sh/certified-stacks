                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "${datasource}"
                    },
                    "instant": true,
                    "range": false
                  }
                ],
                "id": 3,
                "gridPos": {
                  "x": 5,
                  "y": 1,
                  "w": 5,
                  "h": 4
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                }
              },
              {
                "type": "stat",
                "title": "Output tokens",
                "description": "Generated tokens in the selected range.",
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "#FF6600"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#FF6600",
                          "value": null
                        }
                      ]
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "none",
                  "justifyMode": "auto",
                  "orientation": "auto",
                  "textMode": "value",
                  "wideLayout": true,
                  "showPercentChange": false,
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "",

# Chart fields do not use Go templates. Keep the GPU Operator version here.
#
# Controllers use the CPU node selector when one is set. NVIDIA node agents tolerate the
# `nvidia.com/gpu` NoSchedule taint and follow the operator's own GPU discovery labels.
#
# `wait: true` covers only objects in this chart. ClusterPolicy operands, such as the driver and
# device plugin, come up later. The `gpuready` gate waits for them.
apiVersion: management.loft.sh/v1
kind: App
metadata:
  name: nvidia-gpu-operator-stack-gpu-operator
spec:
  displayName: '[NVIDIA GPU Operator Stack] NVIDIA GPU Operator'
  description: Installs the NVIDIA GPU Operator with CPU-placed controllers and GPU node agents.
  defaultNamespace: gpu-operator
  wait: true
  timeout: 15m
  config:
    chart:
      name: gpu-operator
      repoURL: https://helm.ngc.nvidia.com/nvidia
      version: v26.3.3
    values: |-
      {{- $cpu := dict -}}
      {{- with .Values.cpuNodeSelector }}{{ $kv := splitn "=" 2 . }}{{ $_ := set $cpu $kv._0 $kv._1 }}{{ end -}}
      {{- $gpu := dict -}}
      {{- with .Values.gpuNodeSelector }}{{ $kv := splitn "=" 2 . }}{{ $_ := set $gpu $kv._0 $kv._1 }}{{ end -}}
      operator:
        defaultRuntime: containerd
        nodeSelector:
          kubernetes.io/os: linux
          {{- range $k, $v := $cpu }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        tolerations: []
      driver:
        # Stack parameters arrive as the strings "true" and "false".
        enabled: {{ if eq (toString .Values.driverPreinstalled) "true" }}false{{ else }}true{{ end }}
      toolkit:
        enabled: true
      devicePlugin:
        enabled: true
      cdi:
        enabled: true
      migManager:
        enabled: false
      dcgm:
        enabled: true
      dcgmExporter:
        enabled: true
        repository: nvcr.io/nvidia/k8s
        image: dcgm-exporter
        version: 4.5.3-4.8.2-distroless
        enablePodLabels: false
        enablePodUID: false
        config:
          create: true
          name: custom-dcgm-exporter-metrics
          data: |-
            # Format: DCGM field, Prometheus metric type, help message. Lines starting with '#' are comments.
            # Supplying config.data replaces the exporter default set, so every metric the shipped dashboards query must be listed here.
            DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
            DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).
            DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
            DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).
            DCGM_FI_DEV_POWER_USAGE,              gauge, Power draw (in W).
            DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
            DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.
            DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
            DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
            DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).
            DCGM_FI_DEV_DEC_UTIL,      gauge, Decoder utilization (in %).
            DCGM_FI_DEV_XID_ERRORS,    gauge, Value of the last XID error encountered.
            DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
            DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
            DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (in MiB).
            DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Total number of NVLink bandwidth counters for all lanes.
            DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status.
            DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors.
            DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,   counter, Number of remapped rows for correctable errors.
            DCGM_FI_DEV_ROW_REMAP_FAILURE,           gauge,   Whether remapping of rows has failed.
            DCGM_FI_DRIVER_VERSION, label, Driver Version.
            DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
            DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
            DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface is active.
            DCGM_FI_PROF_PCIE_TX_BYTES,      gauge, Rate of data transmitted over the PCIe bus in bytes per second.
            DCGM_FI_PROF_PCIE_RX_BYTES,      gauge, Rate of data received over the PCIe bus in bytes per second.
            # Added by vCluster Platform so the Fleet Observability dashboards populate. Disabled in the upstream default set.
            DCGM_EXP_XID_ERRORS_COUNT, counter, Count of XID errors within the last counter window.
            DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, Total number of NVLink FLIT CRC errors.
            DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, Total number of NVLink data CRC errors.
        serviceMonitor:
          enabled: false
          interval: 15s
      nodeStatusExporter:
        enabled: true
      nfd:
        enabled: true
      gfd:
        enabled: true
      node-feature-discovery:
        postDeleteCleanup: false
        master:
          nodeSelector:
            kubernetes.io/os: linux
            {{- range $k, $v := $cpu }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
        gc:
          nodeSelector:
            kubernetes.io/os: linux
            {{- range $k, $v := $cpu }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
        worker:
          {{- if $gpu }}
          nodeSelector:
            kubernetes.io/os: linux
            {{- range $k, $v := $gpu }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
      daemonsets:
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
  parameters:
    - variable: cpuNodeSelector
      label: CPU node selector
      description: Optional key=value label selector for the operator, NFD master, and NFD garbage collector.
      type: string
    - variable: gpuNodeSelector
      label: GPU node selector
      description: Optional key=value label selector for NFD workers. Empty runs NFD workers on every node.
      type: string
    - variable: driverPreinstalled
      label: NVIDIA driver preinstalled
      description: Set true when the node OS image already contains the NVIDIA driver.
      type: boolean
      defaultValue: "false"

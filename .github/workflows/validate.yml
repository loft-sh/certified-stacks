name: OpenTofu Validate

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tpl'
      - '**/*.tftest.hcl'
      - '.terraform-docs.yml'
      - '.github/workflows/validate.yml'
      - '.tflint.hcl'

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - run-ai/_shared/runai-auth
          - run-ai/_shared/runai-cluster-registration
          - run-ai/_shared/runai-project
          - run-ai/hard-multitenancy
          - run-ai/soft-multitenancy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: terraform-linters/setup-tflint@4cb9feea73331a35b422df102992a03a44a3bb33 # v6.2.1
      - name: TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint

  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - run-ai/_shared/runai-auth
          - run-ai/_shared/runai-cluster-registration
          - run-ai/_shared/runai-project
          - run-ai/hard-multitenancy
          - run-ai/soft-multitenancy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Init
        working-directory: ${{ matrix.directory }}
        run: tofu init -backend=false
      - name: OpenTofu Validate
        working-directory: ${{ matrix.directory }}
        run: tofu validate

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - run-ai/_shared/runai-auth
          - run-ai/_shared/runai-cluster-registration
          - run-ai/_shared/runai-project
          - run-ai/hard-multitenancy
          - run-ai/soft-multitenancy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Init
        working-directory: ${{ matrix.directory }}
        run: tofu init -backend=false
      - name: OpenTofu Test
        working-directory: ${{ matrix.directory }}
        run: tofu test -no-color

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - run-ai/_shared/runai-auth
          - run-ai/_shared/runai-cluster-registration
          - run-ai/_shared/runai-project
          - run-ai/hard-multitenancy
          - run-ai/soft-multitenancy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ matrix.directory }}
          output-file: README.md
          output-method: inject
          args: --sort-by required --anchor=false
          fail-on-diff: true
